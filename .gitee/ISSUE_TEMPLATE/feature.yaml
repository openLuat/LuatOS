name: 需求申请
description: 对本项目提出一个新功能或改进建议
body:
  - type: textarea
    id: feature-description
    attributes:
      label: 需求描述
      description: 请清晰描述您希望新增或改进的功能是什么。
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 在什么情况下需要这个功能？它解决了您什么具体问题？
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 您希望这个功能如何工作？请描述预期结果或交互流程。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
      description: 目前是否有其他方式（例如现有功能、第三方工具、手动操作）可以近似满足需求？如果有，请说明其局限性。
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 附加信息（可选）
      description: 您可以添加截图、参考资料、相关链接或任何其他有助于理解需求的上下文。
    validations:
      required: false