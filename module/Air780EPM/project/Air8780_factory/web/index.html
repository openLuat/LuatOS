    <style id="critical-layout">
        :root {
            font-family: var(--brand-font-sans);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            overflow-x: hidden;
        }
        body {
            background: var(--bg);
            color: var(--text);
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: var(--card);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 50;
            flex-shrink: 0;
            gap: 12px;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .brand-icon {
            color: var(--primary);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.2;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .header .name {
            font-size: 13px;
            color: var(--muted);
        }

        /* ---------- 标签页布局 ---------- */
        .layout {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }
        .tab-bar {
            display: flex;
            gap: 0;
            background: var(--card);
            border-top: 1px solid var(--border);
            overflow-x: auto;
            flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
            position: sticky;
            bottom: 0;
            z-index: 10;
        }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex: 1;
            min-width: 0;
            padding: 8px 4px 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 10px;
            font-weight: 500;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: .2s;
            border-top: 2px solid transparent;
            white-space: nowrap;
        }
        .tab-btn:hover { color: var(--primary); background: var(--primary-light); }
        .tab-btn.active { color: var(--primary); border-top-color: var(--primary); font-weight: 600; }
        .tab-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
        .tab-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px;
            padding-bottom: 60px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        .tab-page { display: none; }
        .tab-page.active { display: block; }
        /* 桌面端：侧边栏 */
        @media(min-width:768px) {
            .layout { flex-direction: row; }
            .tab-bar {
                flex-direction: column;
                width: 80px;
                min-width: 80px;
                border-top: none;
                border-right: 1px solid var(--border);
                border-bottom: none;
                overflow-y: auto;
                overflow-x: hidden;
                padding-top: 8px;
                position: static;
            }
            .tab-btn {
                padding: 14px 6px;
                border-top: none;
                border-right: 2px solid transparent;
                border-bottom: none;
                font-size: 11px;
                gap: 5px;
            }
            .tab-btn.active { border-right-color: var(--primary); border-top: none; }
            .tab-content { padding: 20px 24px; padding-bottom: 20px; max-width: 960px; }
            .chart-box { height: 300px; }
            .map-wrap { height: 450px; }
        }
        /* 标签页内卡片 */
        .tab-page .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            margin-bottom: 12px;
        }
        .tab-page .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        /* ---------- 旧布局兼容（sidebar/main-content 重命名） ---------- */
        .sidebar { display: none; }
        .main-content { display: none; }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .card-title svg {
            flex-shrink: 0;
            color: var(--muted);
        }

        /* ---------- 顶部行：状态 + 控制 并排 ---------- */
        .top-row {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 16px;
        }

        .status-bar {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80px;
        }
        .status-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .status-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .status-title strong {
            font-size: 15px;
        }
        .status-title .muted,
        .status-meta {
            color: var(--muted);
            font-size: 12px;
        }
        .status-meta {
            margin-top: 4px;
        }

        /* 控制面板紧凑 */
        .control-panel {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80px;
        }
        .control-panel .card-title {
            margin-bottom: 6px;
            font-size: 13px;
        }
        .control-panel .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            align-items: center;
            margin-bottom: 4px;
        }
        .control-panel .control-group label {
            font-weight: 500;
            font-size: 12px;
            white-space: nowrap;
        }
        .control-panel .control-group input[type="number"] {
            width: 70px;
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
        }
        .control-panel .control-group input[type="text"] {
            flex: 1;
            min-width: 80px;
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
        }
        .control-panel .control-group .unit {
            font-size: 11px;
            color: var(--muted);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 7px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: .2s;
            background: var(--primary);
            color: #fff;
            font-size: 13px;
        }
        .btn:hover {
            opacity: .85;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            background: var(--bg);
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .hidden {
            display: none !important;
        }

        .query-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .query-row input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #fff;
        }
        .query-row input:focus {
            border-color: var(--primary);
        }
        .project-select {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
            margin-bottom: 8px;
            outline: none;
        }

        .device-list {
            max-height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .device-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: default;
            border: 1px solid transparent;
            transition: .2s;
            gap: 6px;
        }
        .device-item:hover {
            background: var(--primary-light);
        }
        .device-item.active {
            background: var(--primary-light);
            border-color: var(--primary);
        }
        .device-item .dev-info {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .device-item .dev-info .name {
            font-weight: 500;
            font-size: 13px;
        }
        .device-item .dev-info .id {
            font-size: 11px;
            color: var(--muted);
        }
        .btn-refresh {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            color: var(--muted);
            transition: .2s;
            flex-shrink: 0;
        }
        .btn-refresh:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-refresh.loading {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status-led {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .status-led.online {
            background: #dcfce7;
            color: #166534;
        }
        .status-led.online::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        .status-led.offline {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-led.offline::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ef4444;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: .4;
            }
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .sensor-item {
            background: var(--bg);
            padding: 12px 8px;
            border-radius: 8px;
            text-align: center;
        }
        .sensor-item .label {
            font-size: 11px;
            color: var(--muted);
        }
        .sensor-item .value {
            font-size: 18px;
            font-weight: 600;
            margin-top: 2px;
        }

        /* ---------- 查询区域 ---------- */
        .query-area .time-range {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            align-items: center;
        }
        .time-range .quick-btn {
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            transition: .2s;
        }
        .time-range .quick-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .time-range .quick-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .time-range input[type="date"] {
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 12px;
            outline: none;
        }
        .time-range input[type="date"]:focus {
            border-color: var(--primary);
        }

        /* ---------- 图表 ---------- */
        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .chart-box {
            height: 280px;
            border-radius: 8px;
            background: var(--bg);
            overflow: hidden;
            position: relative;
        }
        .chart-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 13px;
            pointer-events: none;
        }

        /* ---------- 地图 ---------- */
        .map-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .map-wrap {
            position: relative;
            height: 400px;
            border-radius: var(--radius);
            overflow: hidden;
            background: #eef2f6;
            flex: 1;
        }
        #map-container {
            width: 100%;
            height: 100%;
        }
        .map-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            flex-direction: column;
            gap: 6px;
            text-align: center;
            font-size: 13px;
            pointer-events: none;
            background: rgba(238, 242, 246, 0.7);
        }

        /* ---------- 历史表格 ---------- */
        .table-wrap {
            overflow-x: auto;
            max-height: 360px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th,
        td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            white-space: nowrap;
        }
        th {
            background: var(--bg);
            position: sticky;
            top: 0;
            font-size: 11px;
        }

        .notice {
            padding: 8px 12px;

    <script>
        /* ============================================================
           核心 SDK + 认证模块（与 login.html 一致，此处完整包含）
           ============================================================ */
        (() => {
            'use strict';
            const API_HOST = 'https://api-iot.luatos.com';
            const BASE_HOST = 'https://iot.luatos.com';
            const APP_ID_FALLBACK = '';
            const appId = location.pathname.match(/\/ai_app\/luatos\/([^/]+)/)?.[1] || APP_ID_FALLBACK;
            const local = location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
            const pagePath = name => appId ? '/ai_app/luatos/' + encodeURIComponent(appId) + '/' + name : location.pathname
                .replace(/[^/]*$/, name);

            function getOAuthCallback() {
                if (!appId || !/^[A-Za-z0-9_-]+$/.test(appId)) throw Object.assign(new Error(
                    '请从已部署的应用网址打开登录页，本地预览不能发起授权登录。'), { type: 'deployment' });
                return BASE_HOST + pagePath('login.html');
            }
            const url = new URL(location.href),
                hash = new URLSearchParams(url.hash.slice(1));
            const initial = new Map([...hash, ...url.searchParams]);
            const sensitive = k => /^(m_|token$|salt$|sid$|error$|error_description$|access_token$)/i.test(k);
            const cleanAuthHash = [...hash.keys()].some(sensitive);
            for (const k of [...url.searchParams.keys()])
                if (sensitive(k)) url.searchParams.delete(k);
            for (const k of [...hash.keys()])
                if (sensitive(k)) hash.delete(k);
            if (cleanAuthHash) url.hash = hash.toString();
            let initError = '';
            try { history.replaceState(null, '', url.href); } catch { initError = '浏览器无法清理登录信息，请关闭此页后重新进入。'; }
            const error = (message, type = 'business') => Object.assign(new Error(message), { type });
            const LuatSDK = {
                config: {
                    API_HOST,
                    BASE_HOST,
                    API_BASE: API_HOST + '/iot/open_api',
                    OAUTH_URL: API_HOST + '/iam/luat_oauth/authorize',
                    timeout: 18000
                },
                storage: {
                    get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
                    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { throw error(
                                '浏览器无法保存数据，请允许本网站使用本地存储后重试。', 'storage'); } },
                    remove(k) { try { localStorage.removeItem(k); } catch { throw error(
                                '无法清理登录信息，请检查浏览器存储设置。', 'storage'); } },
                    clear(prefix) { try { Object.keys(localStorage).filter(k => k.startsWith(prefix)).forEach(k =>
                            localStorage.removeItem(k)); } catch { throw error('无法清理本地数据。', 'storage'); } }
                },
                http: {
                    async request(path, { method = 'POST', body, headers = {} } = {}) {
                        const controller = new AbortController(),
                            timer = setTimeout(() => controller.abort(), LuatSDK.config.timeout);
                        try {
                            const target = path.startsWith('/iam/') ? API_HOST + path : LuatSDK.config.API_BASE +
                            path;
                            const response = await fetch(target, { method, headers: { 'Content-Type': 'application/json',
                                    ...headers }, body: body === undefined ? undefined : JSON.stringify(body),
                                signal: controller.signal, credentials: 'omit', cache: 'no-store',
                                referrerPolicy: 'no-referrer' });
                            if (!response.ok) throw error(response.status === 401 || response.status === 403 ?
                                '登录验证未通过，请重新进入应用。' : '服务暂时不可用，请稍后重试。', response.status === 401 ?
                                'unauthorized' : 'http');
                            try { return await response.json(); } catch { throw error(
                                    '服务返回的数据无法读取，请重试。', 'parse'); }
                        } catch (e) { if (e.type) throw e; throw error(e.name === 'AbortError' ?
                                '请求超时，请重试。' : '网络连接失败，请检查网络后重试。', e.name === 'AbortError' ?
                                'timeout' : 'network'); } finally { clearTimeout(timer); }
                    },
                    get(path, headers) { return this.request(path, { method: 'GET', headers }); },
                    post(path, body, headers) { return this.request(path, { body, headers }); }
                }
            };
            const storage = LuatSDK.storage,
                valid = v => typeof v === 'string' && v.trim().length > 0;
            const complete = c => !!c && valid(c.auth?.token) && valid(c.auth?.salt) && valid(c.service?.sid);

            function session(k, v) { try { if (v !== undefined) sessionStorage.setItem(k, v); return sessionStorage.getItem(
                        k); } catch { throw error('浏览器无法保存登录会话，请允许本网站存储后重试。', 'storage'); } }

            function hostSession() { return session('m_host_session') === '1'; }

            function saveAtomic(prefix, values) {
                const keys = ['auth', 'service', 'profile', 'tenant', 'sets'].map(k => prefix + k),
                    old = keys.map(k => storage.get(k));
                try { keys.forEach((k, i) => { const v = values[k.slice(prefix.length)]; v == null ? storage.remove(
                            k) : storage.set(k, v); }); } catch (e) { keys.forEach((k, i) => { try { old[i] ==
                            null ? storage.remove(k) : storage.set(k, old[i]); } catch {} }); throw e; }
            }

            function initAuth() {
                if (initError) throw error(initError, 'storage');
                storage.set('bag_storage_probe', 1);
                storage.remove('bag_storage_probe');
                const m = { auth: { token: initial.get('m_token'), salt: initial.get('m_salt') }, service: { sid: initial
                            .get('m_sid') } };
                if (complete(m)) {
                    m.profile = { name: initial.get('m_name') || '', mobile: initial.get('m_phone') || '' };
                    const sets = {};
                    ['algorithm', 'encryptOutput', 'padding', 'publicKey', 'publicKeyEncoding'].forEach(k => { if (
                            valid(initial.get('m_' + k))) sets[k] = initial.get('m_' + k); });
                    if (Object.keys(sets).length) m.sets = sets;

            // ---- 历史 ----
            const HISTORY_TAGS = [256, 257, 263, 258, 782, 512, 513];

            async function loadHistory(imei, page = 1, size = 50) {
                const tr = getTimeRange();
                const filter = { start: tr.start + ' 00:00:00', end: tr.end + ' 23:59:59' };
                try {
                    console.log('[loadHistory] query:', imei, filter, 'historyDays:', S.historyDays);
                    const res = await throttledApi('/aircloud/list_by_tags', { client_id: imei, tags: HISTORY_TAGS,
                        page, size, filter });
                    console.log('[loadHistory] res:', JSON.stringify(res).slice(0, 500));
                    const rows = records(res);
                    console.log('[loadHistory] rows:', rows.length, 'total:', res.total);
                    S.historyTotal = Number(res.total) || 0;
                    S.historyPage = page;
                    const merged = {};
                    const order = [];
                    rows.forEach(r => {
                        const key = r.ct || '';
                        if (!merged[key]) { merged[key] = { ct: key };
                            order.push(key); }
                        HISTORY_TAGS.forEach(t => {
                            const v = r['val_' + t];
                            if (v !== undefined && v !== null) merged[key]['t' + t] = v;
                        });
                    });
                    S.history = order.map(k => merged[k]);
                    console.log('[loadHistory] merged:', S.history.length, 'entries');
                    // 如果今日无数据且是今日模式，自动扩大到7天
                    if (S.history.length === 0 && S.historyDays <= 1) {
                        console.log('[loadHistory] 今日无数据，尝试近7天');
                        S.historyDays = 7;
                        setTimeRangeUI();
                        document.querySelectorAll('#timeRange .quick-btn').forEach(b => b.classList.remove('active'));
                        const btn7 = document.querySelector('#timeRange .quick-btn[data-days="7"]');
                        if (btn7) btn7.classList.add('active');
                        return await loadHistory(imei, 1, size);
                    }
                    // 无数据时清空图表和轨迹
                    if (S.history.length === 0) {
                        if (S.chartTempHumi) { S.chartTempHumi.dispose(); S.chartTempHumi = null; }
                        if (S.chartCpuVoc) { S.chartCpuVoc.dispose(); S.chartCpuVoc = null; }
                        if (S.histPathLayer) { S.histPathLayer.setMap(null); S.histPathLayer = null; }
                        if (S.histMarkerLayer) { S.histMarkerLayer.setMap(null); S.histMarkerLayer = null; }
                        if (S.histHoverMarkers) { S.histHoverMarkers.setMap(null); S.histHoverMarkers = null; }
                    }
                    renderHistory();
                    renderHistoryCharts();
                    renderHistoryPath();
                    loadMoreBtn.classList.toggle('hidden', page >= Math.ceil(S.historyTotal / size));
                } catch (e) { console.error('[loadHistory] error:', e); toast('历史数据加载失败：' + e.message, 'error'); }
            }

            function renderHistory() {
                if (!S.history.length) { historyBody.innerHTML =
                        '<tr><td colspan="8" style="text-align:center;color:var(--muted);">该时间段暂无数据</td></tr>';
                    historySummary.textContent = ''; return; }
                let html = '';
                S.history.forEach(r => {
                    let lng = '--',
                        lat = '--';
                    const rawPos = coordinate({ lat: r.t513, lng: r.t512 });
                    if (rawPos) { const gcj = wgs84ToGcj02(rawPos.lat, rawPos.lng);
                        lng = gcj.lng.toFixed(6);
                        lat = gcj.lat.toFixed(6); }
                    html +=
                        `<tr><td>${r.ct || '--'}</td><td>${r.t256 ?? '--'}</td><td>${r.t257 ?? '--'}</td><td>${r.t263 ?? '--'}</td><td>${r.t258 ?? '--'}</td><td>${r.t782 ?? '--'}</td><td>${lng}</td><td>${lat}</td></tr>`;
                });
                historyBody.innerHTML = html;
                historySummary.textContent = '共 ' + S.historyTotal + ' 条 · ' + S.history.length + ' 行';
            }

            // ---- 图表 ----
            function renderHistoryCharts() {
                if (!S.history.length || typeof echarts === 'undefined') return;
                const times = S.history.map(r => r.ct ? r.ct.slice(5, 16) : '');
                const temp = S.history.map(r => r.t256 !== undefined ? Number(r.t256) : null);
                const humi = S.history.map(r => r.t257 !== undefined ? Number(r.t257) : null);
                const cpu = S.history.map(r => r.t263 !== undefined ? Number(r.t263) : null);
                const voc = S.history.map(r => r.t258 !== undefined ? Number(r.t258) : null);

                // 根据时间范围决定 x 轴刻度格式
                const isToday = S.historyDays <= 1;
                const dataLen = times.length;
                // 窄屏（手机）自适应：减少刻度数量、给旋转标签留出画布空间（仅影响绘制，不影响业务）
                const narrow = window.innerWidth < 640;
                const rotateLabel = !isToday && dataLen > 15;
                let interval = isToday ? 'auto' : (dataLen > 60 ? Math.floor(dataLen / 30) : 'auto');
                if (interval === 'auto') interval = Math.max(1, Math.floor(dataLen / (isToday ? (narrow ? 6 : 12) : (
                    narrow ? 8 : 15))));

                const baseOpt = {
                    tooltip: { trigger: 'axis', backgroundColor: '#fff', borderColor: '#e2e8f0',
                        textStyle: { color: '#1e293b', fontSize: 12 } },
                    legend: { top: 4, textStyle: { fontSize: 11 } },
                    grid: { left: narrow ? 46 : 40, right: narrow ? 16 : 12, top: 36,
                        bottom: (rotateLabel && narrow) ? 58 : 24, containLabel: false },
                    xAxis: {
                        type: 'category',
                        data: times,
                        boundaryGap: false,
                        axisLabel: {
                            fontSize: 10,
                            rotate: rotateLabel ? 45 : 0,
                            interval: interval,
                            formatter: function(v) {
                                const parts = v.split(' ');
                                if (parts.length !== 2) return v;
                                if (isToday) {
                                    // 今日：只显示小时 "14:00"
                                    return parts[1];
                                } else {
                                    // 7天/30天：显示日期 "09-09"
                                    return parts[0];
                                }
                            }
                        },
                        splitLine: { show: true, lineStyle: { color: '#f1f5f9', type: 'dashed' } }
                    },
                    yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f1f5f9' } }, axisLabel: { fontSize: 10 } }
                };

                const el1 = $('chartTempHumi');
                if (el1) {
                    const emp1 = el1.querySelector('.chart-empty');
                    if (emp1) emp1.style.display = 'none';
                    if (!S.chartTempHumi) S.chartTempHumi = echarts.init(el1);
                    S.chartTempHumi.setOption(Object.assign({}, baseOpt, {
                        series: [
                            { name: '温度°C', type: 'line', smooth: true, showSymbol: false, data: temp,
                                connectNulls: true, itemStyle: { color: '#22d3ee' } },
                            { name: '湿度%', type: 'line', smooth: true, showSymbol: false, data: humi,
                                connectNulls: true, itemStyle: { color: '#34d399' } }
                        ]
                    }));
                    S.chartTempHumi.resize();
                }
                const el2 = $('chartCpuVoc');
                if (el2) {
                    const emp2 = el2.querySelector('.chart-empty');
                    if (emp2) emp2.style.display = 'none';
                    if (!S.chartCpuVoc) S.chartCpuVoc = echarts.init(el2);
                    S.chartCpuVoc.setOption(Object.assign({}, baseOpt, {
                        series: [
                            { name: 'CPU°C', type: 'line', smooth: true, showSymbol: false, data: cpu,
                                connectNulls: true, itemStyle: { color: '#fbbf24' } },
                            { name: 'VOC ppb', type: 'line', smooth: true, showSymbol: false, data: voc,
                                connectNulls: true, itemStyle: { color: '#f87171' } }
                        ]
                    }));
                    S.chartCpuVoc.resize();
                }
                S.chartDataReady = true;
            }

            // ---- 历史轨迹 + 悬停标记 ----
            function renderHistoryPath() {
                if (!S.mapReady || !S.map) return;
                if (S.histPathLayer) { S.histPathLayer.setMap(null);
                    S.histPathLayer = null; }
                if (S.histMarkerLayer) { S.histMarkerLayer.setMap(null);
                    S.histMarkerLayer = null; }
                if (S.histHoverMarkers) { S.histHoverMarkers.setMap(null);
                    S.histHoverMarkers = null; }

                const points = [];
                S.history.forEach(r => {
                    const rawPos = coordinate({ lat: r.t513, lng: r.t512 });
                    if (rawPos) { const gcj = wgs84ToGcj02(rawPos.lat, rawPos.lng);
                        points.push({ pos: new TMap.LatLng(gcj.lat, gcj.lng), time: r.ct, temp: r.t256, humi: r
                                .t257, cpu: r.t263, voc: r.t258, signal: r.t782 }); }
                });
                if (!points.length) return;

                // 折线（使用 Polyline 绘制单条轨迹线）
                S.histPathLayer = new TMap.MultiPolyline({
                    map: S.map,
                    styles: { histPath: new TMap.PolylineStyle({ color: '#22d3ee', width: 4, borderWidth: 1,
                            borderColor: 'rgba(0,0,0,0.3)', lineCap: 'round', lineJoin: 'round' }) },
                    geometries: [{ id: 'histPath', paths: [points.map(p => p.pos)], styleId: 'histPath' }]
                });

                // 起终点标记
                const mkSvg = (c) => encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="' +
                    c + '" stroke="#fff" stroke-width="2"/></svg>');
                S.histMarkerLayer = new TMap.MultiMarker({
                    map: S.map,
                    styles: {
                        start: new TMap.MarkerStyle({ width: 20, height: 20, anchor: { x: 10, y: 10 },
                            src: 'data:image/svg+xml;charset=utf-8,' + mkSvg('#34d399') }),
                        end: new TMap.MarkerStyle({ width: 20, height: 20, anchor: { x: 10, y: 10 },
                            src: 'data:image/svg+xml;charset=utf-8,' + mkSvg('#f87171') })
                    },
                    geometries: [
                        { id: 'start', styleId: 'start', position: points[0].pos, properties: { label: '起点',
                                time: points[0].time } },
                        { id: 'end', styleId: 'end', position: points[points.length - 1].pos,
                        properties: { label: '终点', time: points[points.length - 1].time } }
                    ]
                });

                // ---- 悬停预览标记（采样点，带mouseover） ----
                const sampleStep = Math.max(1, Math.floor(points.length / 30));
                const sampled = [];
                for (let i = 0; i < points.length; i += sampleStep) {
                    sampled.push({ idx: i, ...points[i] });
                }
                // 确保包含最后一个点
                if (sampled.length && sampled[sampled.length - 1].idx !== points.length - 1) {
                    sampled.push({ idx: points.length - 1, ...points[points.length - 1] });
                }

                const hoverStyles = {
                    dot: new TMap.MarkerStyle({
                        width: 8,
                        height: 8,
                        anchor: { x: 4, y: 4 },
                        src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
                            '<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><circle cx="4" cy="4" r="3" fill="#3b82f6" stroke="#fff" stroke-width="1"/></svg>'
                            )
                    })
                };
                const hoverGeoms = sampled.map((p, idx) => ({
                    id: 'hover_' + idx,
                    styleId: 'dot',
                    position: p.pos,
                    properties: {
                        time: p.time || '--',
                        temp: p.temp !== undefined ? p.temp : '--',
                        humi: p.humi !== undefined ? p.humi : '--',
                        cpu: p.cpu !== undefined ? p.cpu : '--',
                        voc: p.voc !== undefined ? p.voc : '--',
                        signal: p.signal !== undefined ? p.signal : '--',
                        idx: p.idx
                    }
                }));

                S.histHoverMarkers = new TMap.MultiMarker({
                    map: S.map,
                    styles: hoverStyles,
                    geometries: hoverGeoms
                });

                // 悬停事件：显示信息窗口
                let hoverInfoWin = null;
                S.histHoverMarkers.on('mouseover', function(evt) {
                    const props = evt.geometry?.properties;
                    if (!props) return;
                    const content =
                        `<div style="padding:6px 10px;font-size:12px;max-width:200px;">
                              <div><strong>${props.time || '--'}</strong></div>
                              <div>温度: ${props.temp}°C &nbsp; 湿度: ${props.humi}%</div>
                              <div>CPU: ${props.cpu}°C &nbsp; VOC: ${props.voc}ppb</div>
                              <div>信号: ${props.signal}</div>
                            </div>`;
                    if (hoverInfoWin) { hoverInfoWin.close();
                        hoverInfoWin = null; }
                    hoverInfoWin = new TMap.InfoWindow({
                        map: S.map,
                        position: evt.geometry.position,
                        content: content,
                        offset: { x: 0, y: -16 }
                    });
                    hoverInfoWin.open();
                });
                S.histHoverMarkers.on('mouseout', function() {
                    if (hoverInfoWin) { hoverInfoWin.close();
                        hoverInfoWin = null; }
                });

                // 默认以最新位置为中心
                const lastPt = points[points.length - 1];
                S.map.setCenter(lastPt.pos);
                S.map.setZoom(14);
            }

            // ---- 地图（动态加载SDK） ----
            let mapRetries = 0;
            let mapSdkLoading = false;
            let mapSdkLoaded = false;

            function loadMapSdk() {
                if (mapSdkLoaded || mapSdkLoading) return Promise.resolve();
                mapSdkLoading = true;
                return new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = 'https://map.qq.com/api/gljs?v=1.exp&key=EZNBZ-VA6KW-ASMRR-3UE4S-M3QCO-EYBC6';
                    script.onload = () => { mapSdkLoaded = true; mapSdkLoading = false; resolve(); };
                    script.onerror = () => { mapSdkLoading = false; resolve(); };
                    document.head.appendChild(script);
                    // 超时兜底
                    setTimeout(() => { mapSdkLoading = false; resolve(); }, 8000);
                });
            }

            async function initMap(center, zoom) {
                if (typeof TMap === 'undefined') {
                    // 静态 script 可能还在加载，等待
                    if (mapRetries < 30) {
                        mapRetries++;
                        if (mapRetries <= 3) {
                            mapPlaceholder.innerHTML = '⏳ 正在加载地图...';
                        } else if (mapRetries <= 10) {
                            mapPlaceholder.innerHTML = '⏳ 地图加载中...(' + mapRetries + ')';
                        } else {
                            mapPlaceholder.innerHTML = '⚠️ 地图加载超时<br><button onclick="mapRetries=0;initMap()" style="margin-top:8px;padding:6px 16px;border:1px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary);cursor:pointer;font-size:13px;">点击重试</button>';
                            return;
                        }
                        await new Promise(r => setTimeout(r, mapRetries <= 5 ? 300 : 500));
                        return initMap(center, zoom);
                    }
                    mapPlaceholder.innerHTML = '⚠️ 地图加载失败<br><button onclick="mapRetries=0;initMap()" style="margin-top:8px;padding:6px 16px;border:1px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary);cursor:pointer;font-size:13px;">重试</button>';
                    return;
                }
                if (S.map) return;
                try {
                    const mapCenter = center || new TMap.LatLng(31.23, 121.47);
                    const mapZoom = zoom || 4;
                    S.map = new TMap.Map(mapContainer, { center: mapCenter, zoom: mapZoom });
                    S.mapReady = true;
                    mapRetries = 0;
                    mapPlaceholder.style.display = 'none';
                } catch (e) {
                    console.error('[map] init error:', e);
                    mapPlaceholder.innerHTML = '⚠️ 地图初始化失败: ' + e.message;
                }
            }

            function updateMap(lng, lat, title, address) {
                if (!S.mapReady || !S.map) {
                    initMap(new TMap.LatLng(lat, lng), 14).then(() => {
                        if (S.mapReady) updateMap(lng, lat, title, address);
                    });
                    return;
                }
                if (S.marker) { S.marker.setMap(null);
                    S.marker = null; }
                if (S.infoWin) { S.infoWin.close();
                    S.infoWin = null; }
                const pos = new TMap.LatLng(lat, lng);
                S.map.setCenter(pos);
                S.map.setZoom(15);
                S.marker = new TMap.MultiMarker({
                    map: S.map,
                    styles: { default: new TMap.MarkerStyle({ width: 30, height: 30, anchor: { x: 15, y: 30 },
                            src: 'https://mapapi.qq.com/web/lbs/javascriptGL/demo/img/markerDefault.png' }) },
                    geometries: [{ id: 'device', styleId: 'default', position: pos, properties: { title: title ||
                                '设备', address: address || '' } }]
                });
                S.infoWin = new TMap.InfoWindow({
                    map: S.map,
                    position: pos,
                    content: `<div style="padding:8px 12px;"><strong>${title||'设备'}</strong><br><span style="font-size:12px;color:#666;">${address||''}</span></div>`
                });
                S.infoWin.open();
                mapPlaceholder.style.display = 'none';
            }

            function showMapPlaceholder(msg) {
                mapPlaceholder.style.display = '';
                mapPlaceholder.textContent = '🗺️ ' + (msg || '无位置数据');
                if (S.marker) { S.marker.setMap(null);
                    S.marker = null; }
                if (S.infoWin) { S.infoWin.close();
                    S.infoWin = null; }
            }

            // ---- 控制 ----
            async function setReportCycle(imei, seconds) {
                if (!imei) { toast('请先选择设备', 'error'); return; }
                if (!S.loggedIn) { toast('请先登录', 'error'); return; }
                showNotice(controlStatus, '正在设置...', 'info');
                try {
                    await api('/aircloud/send_cmd', { client_id: imei, tag: 1281, value: 'cycle:' + seconds, protocol: 0 });
                    showNotice(controlStatus, '上报频率已设为 ' + seconds + ' 秒（等待设备响应）', 'success');
                    setTimeout(() => hideNotice(controlStatus), 5000);
                } catch (e) { showNotice(controlStatus, '设置失败：' + e.message, 'error'); }
            }

            async function sendTts(imei, text) {
                if (!imei) { toast('请先选择设备', 'error'); return; }
                if (!S.loggedIn) { toast('请先登录', 'error'); return; }
                if (!text || text.trim() === '') { toast('请输入播报内容', 'error'); return; }
                showNotice(controlStatus, '正在发送...', 'info');
                try {
                    await api('/aircloud/send_cmd', { client_id: imei, tag: 1281, value: text.trim(),
                    protocol: 1 });
                    showNotice(controlStatus, 'TTS 发送成功', 'success');
                    setTimeout(() => hideNotice(controlStatus), 3000);
                } catch (e) { showNotice(controlStatus, '发送失败：' + e.message, 'error'); }
            }

            // ---- 事件绑定 ----
            function bindEvents() {
                loginBtn.addEventListener('click', () => C.requireAuth());
                logoutBtn.addEventListener('click', () => { C.clearLoginStorage();
                    location.reload(); });
                queryBtn.addEventListener('click', () => queryDevice(imeiInput.value));
                imeiInput.addEventListener('keydown', e => { if (e.key === 'Enter') queryDevice(imeiInput.value); });
                scanBtn.addEventListener('click', () => {
                    // 1. 宿主环境 ScanClient（iframe 内有效）
                    if (typeof ScanClient !== 'undefined') {
                        let scanned = false;
                        ScanClient.send('open');
                        ScanClient.onResult((type, payload) => {
                            if (type === 'result' && payload.resultText && !scanned) {
                                scanned = true;
                                imeiInput.value = payload.resultText;
                                queryDevice(payload.resultText);
                            } else if (type === 'error') {
                                toast(payload.message || '扫码失败', 'error');
                            }
                        });
                        return;
                    }
                    // 2. 浏览器环境：优先 BarcodeDetector，否则拍照识别
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        // 尝试 BarcodeDetector 实时扫码
                        if (typeof BarcodeDetector !== 'undefined') {
                            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } }).then(stream => {
                                const video = document.createElement('video');
                                video.srcObject = stream;
                                video.setAttribute('playsinline', 'true');
                                video.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:9999;background:#000;';
                                document.body.appendChild(video);
                                video.play();
                                // 添加关闭按钮
                                const closeBtn = document.createElement('button');
                                closeBtn.textContent = '✕ 取消';
                                closeBtn.style.cssText = 'position:fixed;top:16px;right:16px;z-index:10000;padding:8px 16px;border:none;border-radius:8px;background:rgba(0,0,0,0.6);color:#fff;font-size:14px;cursor:pointer;';
                                document.body.appendChild(closeBtn);
                                const stop = () => { stream.getTracks().forEach(t => t.stop()); video.remove(); closeBtn.remove(); };
                                closeBtn.onclick = stop;
                                const detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13', 'code_39'] });
                                let found = false;
                                const scanLoop = setInterval(() => {
                                    if (found) return;
                                    detector.detect(video).then(barcodes => {
                                        if (barcodes.length > 0 && !found) {
                                            found = true;
                                            clearInterval(scanLoop);
                                            stop();
                                            const text = barcodes[0].rawValue;
                                            imeiInput.value = text;
                                            queryDevice(text);
                                        }
                                    }).catch(() => {});
                                }, 300);
                                setTimeout(() => { if (!found) { clearInterval(scanLoop); stop(); toast('扫码超时', 'error'); } }, 15000);
                            }).catch(() => { this._fallbackPhotoScan(); });
                            return;
                        }
                        // 降级：拍照识别
                        this._fallbackPhotoScan();
                    } else {
                        toast('当前浏览器不支持扫码，请手动输入 IMEI', 'error');
                    }
                });
                // 拍照扫码降级方案
                function _fallbackPhotoScan() {
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = 'image/*';
                    fileInput.capture = 'environment';
                    fileInput.onchange = function() {
                        const file = this.files[0];
                        if (!file) return;
                        const img = new Image();
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            img.onload = function() {
                                const canvas = document.createElement('canvas');
                                canvas.width = img.width;
                                canvas.height = img.height;
                                canvas.getContext('2d').drawImage(img, 0, 0);
                                const imageData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
                                if (typeof jsQR !== 'undefined') {
                                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                                    if (code) {
                                        imeiInput.value = code.data;
                                        queryDevice(code.data);
                                        toast('扫码成功', 'success');
                                    } else {
                                        toast('未识别到二维码，请对准后重试', 'error');
                                    }
                                } else {
                                    toast('扫码库未加载', 'error');
                                }
                            };
                            img.src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    };
                    fileInput.click();
                }
                projectSelect.addEventListener('change', async function() {
                    const key = this.value;
                    if (!key) return;
                    S.currentProjectKey = key;
                    const proj = S.projects.find(p => p.project_key === key);
                    S.currentProjectName = proj ? (proj.name || proj.project_key || '未命名项目') :
                        '未命名项目';
                    projectName.textContent = '（项目：' + S.currentProjectName + '）';
                    await loadDevices(key);
                    toast('已切换到项目：' + S.currentProjectName, 'info');
                });
                deviceSelect.addEventListener('change', function() {
                    const id = this.value;
                    if (id) queryDevice(id);
                });
                setCycleBtn.addEventListener('click', () => {
                    const sec = parseInt(reportCycle.value);
                    if (isNaN(sec) || sec < 5) { toast('请输入有效秒数（≥5）', 'error'); return; }
                    setReportCycle(S.currentDeviceId, sec);
                });
                sendTtsBtn.addEventListener('click', () => { sendTts(S.currentDeviceId, ttsText.value); });
                refreshBtn.addEventListener('click', () => { if (S.currentDeviceId) refreshDevice(S.currentDeviceId, refreshBtn); });
                loadMoreBtn.addEventListener('click', () => {
                    if (S.currentDeviceId) loadHistory(S.currentDeviceId, S.historyPage + 1);
                });
                document.querySelectorAll('#timeRange .quick-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('#timeRange .quick-btn').forEach(b => b.classList
                            .remove('active'));
                        this.classList.add('active');
                        S.historyDays = Number(this.dataset.days || 1);
                        setTimeRangeUI();
                        if (S.currentDeviceId) loadHistory(S.currentDeviceId, 1);
                    });
                });
                $('btnTimeQuery').addEventListener('click', () => {
                    document.querySelectorAll('#timeRange .quick-btn').forEach(b => b.classList.remove(
                        'active'));
                    S.historyDays = 0;
                    if (S.currentDeviceId) loadHistory(S.currentDeviceId, 1);
                });
                $('startDate').addEventListener('change', () => document.querySelectorAll(
                    '#timeRange .quick-btn').forEach(b => b.classList.remove('active')));
                $('endDate').addEventListener('change', () => document.querySelectorAll(
                    '#timeRange .quick-btn').forEach(b => b.classList.remove('active')));
                window.addEventListener('resize', () => {
                    if (S.map) S.map.resize();
                    if (S.chartTempHumi) S.chartTempHumi.resize();
                    if (S.chartCpuVoc) S.chartCpuVoc.resize();
                });
            }

            // ---- 初始化 ----
            async function init() {
                C.initAuth();
                updateUserUI();
                bindEvents();
                setTimeRangeUI();
                initTabs();
                // 地图延迟到打开轨迹标签时再加载
            }

            // ---- 标签页切换 ----
            function initTabs() {
                const tabs = document.querySelectorAll('#tabBar .tab-btn');
                const pages = document.querySelectorAll('.tab-page');
                tabs.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const target = this.dataset.tab;
                        tabs.forEach(b => b.classList.remove('active'));
                        pages.forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        const page = document.getElementById(target);
                        if (page) page.classList.add('active');
                        // 切到趋势时：容器刚可见，需要重新初始化/渲染图表
                        if (target === 'tabCharts') {
                            setTimeout(() => {
                                if (S.history && S.history.length) {
                                    // 销毁旧实例重新创建（隐藏时 ECharts 无法正确计算尺寸）
                                    if (S.chartTempHumi) { S.chartTempHumi.dispose(); S.chartTempHumi = null; }
                                    if (S.chartCpuVoc) { S.chartCpuVoc.dispose(); S.chartCpuVoc = null; }
                                    renderHistoryCharts();
                                } else if (S.currentDeviceId) {
                                    // 没有缓存数据，重新加载
                                    loadHistory(S.currentDeviceId).catch(()=>{});
                                }
                            }, 150);
                        }
                        // 切到轨迹时加载地图并渲染轨迹
                        if (target === 'tabMap') {
                            setTimeout(async () => {
                                console.log('[map-tab] start:', S.currentPos, S.currentDeviceId, S.history?.length);
                                if (!S.currentPos && S.currentDeviceId) {
                                    // 尝试从 list_by_tags 获取最新经纬度（最可靠）
                                    try {
                                        const tagData = await throttledApi('/aircloud/list_by_tags', {
                                            client_id: S.currentDeviceId, tags: [512, 513], page: 1, size: 1
                                        });
                                        const rows = records(tagData);
                                        if (rows.length) {
                                            const r = rows[0];
                                            const lat = Number(r.val_513), lng = Number(r.val_512);
                                            if (lat && lng && lat !== 0 && lng !== 0) {
                                                const gcj = wgs84ToGcj02(lat, lng);
                                                S.currentPos = { lng: gcj.lng, lat: gcj.lat, title: S.currentDeviceId, address: 'LBS' };
                                            }
                                        }
                                    } catch(e) { console.warn('[map] tag fetch:', e); }
                                }
                                if (!S.currentPos && S.currentDeviceId) {
                                    try {
                                        const loc = await throttledApi('/aircloud/latest_location', { client_id: S.currentDeviceId });
                                        if (loc) {
                                            const p = coordinate(loc);
                                            if (p) S.currentPos = { lng: p.lng, lat: p.lat, title: S.currentDeviceId, address: loc.address || '' };
                                        }
                                    } catch(e) {}
                                }
                                if (!S.currentPos && S.history && S.history.length) {
                                    for (const r of S.history) {
                                        const raw = coordinate({ lat: r.t513, lng: r.t512 });
                                        if (raw) {
                                            const gcj = wgs84ToGcj02(raw.lat, raw.lng);
                                            S.currentPos = { lng: gcj.lng, lat: gcj.lat, title: S.currentDeviceId, address: '历史位置' };
                                            break;
                                        }
                                    }
                                }
                                // 初始化地图
                                const center = S.currentPos
                                    ? new TMap.LatLng(S.currentPos.lat, S.currentPos.lng)
                                    : new TMap.LatLng(31.23, 121.47);
                                const zoom = S.currentPos ? 14 : 4;
                                if (!S.map) await initMap(center, zoom);
                                console.log('[map-tab] map ready:', !!S.map, 'pos:', S.currentPos);
                                if (S.map) {
                                    S.map.resize();
                                    if (S.currentPos) {
                                        updateMap(S.currentPos.lng, S.currentPos.lat, S.currentPos.title, S.currentPos.address);
                                    } else {
                                        showMapPlaceholder('暂无位置数据');
                                    }
                                    if (S.history && S.history.length) {
                                        renderHistoryPath();
                                        console.log('[map-tab] rendered path, points:', S.history.length);
                                    }
                                }
                            }, 200);
                        }
                    });
                });
            }
            init();
        })();
    </script>
</body>
</html>
