<svg xmlns="http://www.w3.org/2000/svg" width="120" height="170" viewBox="0 0 120 170">
  <!-- 外壳 -->
  <rect x="3" y="3" width="114" height="164" rx="9" fill="#D9D5C9" stroke="#B5B0A1" stroke-width="1"/>
  <!-- 顶部散热槽 -->
  <g stroke="#C2BDAD" stroke-width="1">
    <line x1="18" y1="14" x2="102" y2="14"/>
    <line x1="18" y1="19" x2="102" y2="19"/>
    <line x1="18" y1="24" x2="102" y2="24"/>
  </g>

  <!-- 数码显示窗 -->
  <rect x="18" y="32" width="84" height="30" rx="3" fill="#16110D" stroke="#0B0805" stroke-width="1"/>

  <!-- 指示灯 -->
  <g font-family="Arial,sans-serif" font-size="4.5">
    <rect x="20" y="64" width="4" height="3" fill="#7A2A24"/>
    <text x="26" y="67.5" fill="#6B6459">RUN</text>
    <rect x="42" y="64" width="4" height="3" fill="#7A2A24"/>
    <text x="48" y="67.5" fill="#6B6459">STOP</text>
    <rect x="66" y="64" width="4" height="3" fill="#7A2A24"/>
    <text x="72" y="67.5" fill="#6B6459">FWD</text>
    <rect x="92" y="64" width="4" height="3" fill="#7A2A24"/>
    <text x="98" y="67.5" fill="#6B6459">REV</text>
  </g>

  <!-- 按键区 -->
  <g rx="2">
    <rect x="20" y="74" width="26" height="11" rx="2" fill="#C6C1B2" stroke="#ADA896" stroke-width="0.6"/>
    <rect x="50" y="74" width="16" height="11" rx="2" fill="#C6C1B2" stroke="#ADA896" stroke-width="0.6"/>
    <rect x="70" y="74" width="32" height="11" rx="2" fill="#3FA96B" stroke="#2E8351" stroke-width="0.6"/>
    <text x="23" y="82" font-family="Arial,sans-serif" font-size="5" fill="#33302A">MODE</text>
    <text x="55" y="82" font-family="Arial,sans-serif" font-size="6" fill="#33302A">▲</text>
    <text x="77" y="82" font-family="Arial,sans-serif" font-size="5" fill="#0F2B1B">RUN</text>

    <rect x="20" y="89" width="26" height="11" rx="2" fill="#C6C1B2" stroke="#ADA896" stroke-width="0.6"/>
    <rect x="50" y="89" width="16" height="11" rx="2" fill="#C6C1B2" stroke="#ADA896" stroke-width="0.6"/>
    <rect x="70" y="89" width="32" height="11" rx="2" fill="#B85A62" stroke="#96464C" stroke-width="0.6"/>
    <text x="23" y="97" font-family="Arial,sans-serif" font-size="5" fill="#33302A">ENTER</text>
    <text x="55" y="97" font-family="Arial,sans-serif" font-size="6" fill="#33302A">▼</text>
    <text x="74" y="97" font-family="Arial,sans-serif" font-size="4.2" fill="#2B0F12">STOP/RESET</text>
  </g>

  <!-- 频率旋钮 -->
  <circle cx="36" cy="118" r="10" fill="#6E6A5E" stroke="#4E4B42" stroke-width="1"/>
  <line x1="36" y1="118" x2="36" y2="110" stroke="#E6E2D6" stroke-width="1.6" stroke-linecap="round"/>
  <text x="26" y="134" font-family="Arial,sans-serif" font-size="3.6" fill="#7B7568">FREQ SET</text>

  <!-- 型号 -->
  <text x="58" y="122" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#3E3B33">VFD-M</text>

  <!-- 铭牌 -->
  <rect x="22" y="138" width="76" height="20" rx="3" fill="#E7E3D6" stroke="#C4BFB0" stroke-width="0.6"/>
  <text x="60" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#3E3B33">1.5KW</text>
  <text x="60" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#6B6459">220V 1/3 PHASE</text>
</svg>
