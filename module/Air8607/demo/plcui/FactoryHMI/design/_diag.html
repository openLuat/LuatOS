<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>pending</title></head>
<body>
<script>
var list = ['_svg/t101.svg','_svg/p101.svg','_svg/fv101.svg','_svg/t102.svg','_svg/e101.svg','_svg/p102.svg','_svg/fv102.svg','_svg/box.svg','_svg/logo.svg','_svg/ic-flow.svg','_svg/ic-param.svg','_svg/ic-alarm.svg','_svg/ic-trend.svg'];
var res = [], done = 0;
list.forEach(function (u, i) {
  var im = new Image();
  im.onload = function () { res[i] = u + '=OK(' + im.naturalWidth + 'x' + im.naturalHeight + ')'; fin(); };
  im.onerror = function () { res[i] = u + '=ERR'; fin(); };
  im.src = u;
});
function fin() {
  done++;
  if (done === list.length) document.title = 'RESULT::' + res.join(' || ');
}
</script>
</body></html>
