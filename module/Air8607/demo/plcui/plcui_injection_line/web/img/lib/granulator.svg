<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 150" width="130" height="150" baseProfile="tiny"
     data-name="粉碎机 1" data-category="granulator" data-subject="granulator"
     data-state="常态" data-color="灰色" data-role="废料回收">
  <title>废料粉碎机</title>
  <desc>边角料粉碎机：进料斗+粉碎室+驱动电机+出料口，回用料经干燥机返回料斗。</desc>
  <defs>
    <linearGradient id="gn-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb3c4"/><stop offset=".5" stop-color="#5b7c8e"/><stop offset="1" stop-color="#33505f"/>
    </linearGradient>
  </defs>

  <!-- 进料斗 -->
  <g data-part="进料斗" data-material="steel" data-shade="cylinder">
    <path d="M18 14 L112 14 L98 52 L32 52 Z" fill="url(#gn-body)" stroke="#5f93a8" stroke-width="1.3"/>
    <rect x="14" y="8" width="102" height="8" rx="3" fill="#7fa9bd" stroke="#416779" stroke-width="1"/>
  </g>

  <!-- 粉碎室 -->
  <g data-part="粉碎室" data-material="steel" data-shade="flat">
    <rect x="30" y="52" width="70" height="56" rx="5" fill="url(#gn-body)" stroke="#5f93a8" stroke-width="1.3"/>
    <!-- 刀片示意 -->
    <g stroke="#29d8f0" stroke-width="2" opacity=".65">
      <line x1="44" y1="66" x2="58" y2="80"/><line x1="58" y1="66" x2="44" y2="80"/>
      <line x1="72" y1="66" x2="86" y2="80"/><line x1="86" y1="66" x2="72" y2="80"/>
      <line x1="58" y1="86" x2="72" y2="98"/><line x1="72" y1="86" x2="58" y2="98"/>
    </g>
  </g>

  <!-- 驱动电机 -->
  <g data-part="电机" data-material="steel" data-shade="cylinder">
    <rect x="100" y="62" width="24" height="36" rx="5" fill="#e07f16" stroke="#a86a12" stroke-width="1.2"/>
    <circle cx="112" cy="80" r="7" fill="#2b404d" stroke="#5f93a8" stroke-width="1"/>
    <g fill="#a86a12"><rect x="102" y="66" width="20" height="2"/><rect x="102" y="72" width="20" height="2"/><rect x="102" y="78" width="20" height="2"/><rect x="102" y="84" width="20" height="2"/></g>
  </g>

  <!-- 出料口 -->
  <g data-part="出料口" data-material="steel" data-shade="flat">
    <path d="M38 108 L92 108 L82 132 L48 132 Z" fill="#41606f" stroke="#5f93a8" stroke-width="1.2"/>
    <rect x="44" y="132" width="42" height="8" rx="2" fill="#2b404d"/>
  </g>
</svg>
