<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" width="360" height="210" baseProfile="tiny"
     data-name="注塑机 1" data-category="machine" data-subject="injection-molding-machine"
     data-state="常态" data-color="灰色" data-role="成型主机">
  <title>注塑机</title>
  <desc>卧式注塑机侧视：左侧锁模单元（尾板/动模板/定模板/拉杆/安全门），右侧注射单元（喷嘴/料筒/加热圈/料斗/注射马达），底部导轨底座，前部操作面板。</desc>
  <defs>
    <linearGradient id="im-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb3c4"/><stop offset=".45" stop-color="#5b7c8e"/><stop offset="1" stop-color="#33505f"/>
    </linearGradient>
    <linearGradient id="im-steel-d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8496"/><stop offset=".5" stop-color="#3c5c6c"/><stop offset="1" stop-color="#223945"/>
    </linearGradient>
    <linearGradient id="im-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c5765"/><stop offset="1" stop-color="#1b2c36"/>
    </linearGradient>
    <linearGradient id="im-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9e6f2"/><stop offset=".5" stop-color="#7fa9bd"/><stop offset="1" stop-color="#4a6f81"/>
    </linearGradient>
    <linearGradient id="im-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd7ea" stop-opacity=".55"/><stop offset="1" stop-color="#2c5666" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="im-hopper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d6e2"/><stop offset="1" stop-color="#5d8496"/>
    </linearGradient>
  </defs>

  <!-- 底座导轨 -->
  <g data-part="底座" data-material="steel" data-shade="flat">
    <rect x="8" y="176" width="344" height="18" rx="3" fill="url(#im-dark)" stroke="#5f93a8" stroke-width="1.2"/>
    <rect x="14" y="180" width="332" height="4" rx="2" fill="#78bed7" opacity=".35"/>
    <rect x="24" y="194" width="30" height="8" rx="2" fill="#22303a"/>
    <rect x="304" y="194" width="30" height="8" rx="2" fill="#22303a"/>
  </g>

  <!-- 锁模单元：尾板 -->
  <g data-part="锁模单元" data-material="steel" data-shade="cylinder">
    <rect x="16" y="62" width="26" height="114" rx="3" fill="url(#im-steel-d)" stroke="#5f93a8" stroke-width="1.2"/>
    <rect x="22" y="72" width="14" height="94" rx="2" fill="#2b404d" opacity=".65"/>
    <!-- 顶出缸 -->
    <rect x="8" y="108" width="12" height="22" rx="3" fill="url(#im-steel)" stroke="#5f93a8" stroke-width="1"/>
  </g>

  <!-- 拉杆 x2 -->
  <g data-part="拉杆" data-material="steel" data-shade="cylinder">
    <rect x="40" y="70" width="122" height="9" rx="4.5" fill="url(#im-bar)" stroke="#416779" stroke-width="1"/>
    <rect x="40" y="150" width="122" height="9" rx="4.5" fill="url(#im-bar)" stroke="#416779" stroke-width="1"/>
  </g>

  <!-- 动模板 -->
  <g data-part="动模板" data-material="steel" data-shade="cylinder">
    <rect x="52" y="56" width="22" height="122" rx="3" fill="url(#im-steel)" stroke="#5f93a8" stroke-width="1.2"/>
    <rect x="57" y="66" width="12" height="102" rx="2" fill="#33505f" opacity=".55"/>
  </g>

  <!-- 模具（动定模之间） -->
  <g data-part="模具" data-material="steel" data-shade="flat">
    <rect x="74" y="88" width="26" height="58" rx="2" fill="url(#im-steel-d)" stroke="#78bed7" stroke-width="1.1"/>
    <rect x="100" y="88" width="26" height="58" rx="2" fill="url(#im-steel-d)" stroke="#78bed7" stroke-width="1.1"/>
    <rect x="98" y="100" width="4" height="34" fill="#101d25"/>
    <circle cx="80" cy="96" r="2.4" fill="#a8cfe0"/><circle cx="80" cy="138" r="2.4" fill="#a8cfe0"/>
    <circle cx="120" cy="96" r="2.4" fill="#a8cfe0"/><circle cx="120" cy="138" r="2.4" fill="#a8cfe0"/>
  </g>

  <!-- 安全门 -->
  <g data-part="安全门" data-material="glass" data-shade="glass">
    <rect x="74" y="60" width="88" height="114" rx="3" fill="url(#im-glass)" stroke="#78bed7" stroke-width="1.3"/>
    <rect x="82" y="70" width="72" height="94" rx="2" fill="#16323e" opacity=".35"/>
    <rect x="150" y="104" width="6" height="26" rx="3" fill="#9fd7ea"/>
  </g>

  <!-- 定模板 -->
  <g data-part="定模板" data-material="steel" data-shade="cylinder">
    <rect x="156" y="56" width="24" height="122" rx="3" fill="url(#im-steel)" stroke="#5f93a8" stroke-width="1.2"/>
    <rect x="161" y="66" width="14" height="102" rx="2" fill="#33505f" opacity=".55"/>
  </g>

  <!-- 喷嘴 -->
  <g data-part="喷嘴" data-material="steel" data-shade="cylinder">
    <path d="M180 110 L206 116 L206 126 L180 132 Z" fill="url(#im-bar)" stroke="#416779" stroke-width="1"/>
  </g>

  <!-- 料筒 + 加热圈 -->
  <g data-part="料筒" data-material="steel" data-shade="cylinder">
    <rect x="204" y="106" width="112" height="30" rx="6" fill="url(#im-steel)" stroke="#5f93a8" stroke-width="1.2"/>
    <g fill="#223945" opacity=".8">
      <rect x="214" y="106" width="5" height="30"/><rect x="232" y="106" width="5" height="30"/>
      <rect x="250" y="106" width="5" height="30"/><rect x="268" y="106" width="5" height="30"/>
      <rect x="286" y="106" width="5" height="30"/><rect x="304" y="106" width="5" height="30"/>
    </g>
  </g>

  <!-- 注射马达 -->
  <g data-part="注射马达" data-material="steel" data-shade="cylinder">
    <rect x="314" y="100" width="36" height="42" rx="6" fill="url(#im-steel-d)" stroke="#5f93a8" stroke-width="1.2"/>
    <circle cx="332" cy="121" r="11" fill="#2b404d" stroke="#78bed7" stroke-width="1.1"/>
    <circle cx="332" cy="121" r="4" fill="#9fd7ea"/>
  </g>

  <!-- 注射座滑道 -->
  <g data-part="注射座" data-material="steel" data-shade="flat">
    <rect x="188" y="142" width="156" height="16" rx="3" fill="url(#im-dark)" stroke="#5f93a8" stroke-width="1"/>
  </g>

  <!-- 料斗 -->
  <g data-part="料斗" data-material="steel" data-shade="cylinder">
    <path d="M252 38 L306 38 L296 82 L262 82 Z" fill="url(#im-hopper)" stroke="#5f93a8" stroke-width="1.3"/>
    <rect x="256" y="32" width="46" height="8" rx="3" fill="url(#im-bar)" stroke="#416779" stroke-width="1"/>
    <rect x="266" y="82" width="26" height="22" fill="#4a6f81" stroke="#5f93a8" stroke-width="1"/>
    <!-- 料位 -->
    <path d="M258 52 L300 52 L294 78 L264 78 Z" fill="#2ee6a0" opacity=".45"/>
  </g>

  <!-- 操作面板 -->
  <g data-part="操作面板" data-material="plastic" data-shade="flat">
    <rect x="196" y="52" width="58" height="40" rx="4" fill="url(#im-dark)" stroke="#5f93a8" stroke-width="1.2"/>
    <rect x="202" y="58" width="46" height="24" rx="2" fill="#0c222c" stroke="#4a8095" stroke-width="1"/>
    <rect x="205" y="61" width="40" height="3" rx="1.5" fill="#29d8f0" opacity=".8"/>
    <rect x="205" y="67" width="28" height="3" rx="1.5" fill="#2ee6a0" opacity=".7"/>
    <rect x="205" y="73" width="33" height="3" rx="1.5" fill="#ffa62b" opacity=".7"/>
    <circle cx="209" cy="87" r="3" fill="#2ee6a0"/><circle cx="220" cy="87" r="3" fill="#ffa62b"/><circle cx="231" cy="87" r="3" fill="#ff4d68"/>
    <!-- 急停 -->
    <circle cx="246" cy="87" r="5.5" fill="#ff4d68" stroke="#8f1e2e" stroke-width="1.4"/>
  </g>

  <!-- 三色灯柱 -->
  <g data-part="灯柱" data-material="plastic" data-shade="cylinder">
    <rect x="120" y="30" width="7" height="28" fill="#3c5765"/>
    <rect x="112" y="14" width="23" height="9" rx="4.5" fill="#ff4d68" stroke="#8f1e2e" stroke-width="1"/>
    <rect x="112" y="23" width="23" height="9" rx="4.5" fill="#ffd23e" stroke="#8a6d1d" stroke-width="1"/>
    <rect x="112" y="32" width="23" height="9" rx="4.5" fill="#2ee6a0" stroke="#1e7a58" stroke-width="1"/>
  </g>
</svg>
