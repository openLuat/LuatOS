<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 110" width="140" height="110" baseProfile="tiny"
     data-name="注塑模具 1" data-category="mold" data-subject="injection-mold"
     data-state="常态" data-color="灰色" data-role="成型模具">
  <title>注塑模具</title>
  <desc>两板式注塑模具：定模座板/动模座板/型腔/导柱/冷却水嘴。</desc>
  <defs>
    <linearGradient id="md-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc4d4"/><stop offset=".5" stop-color="#5b7c8e"/><stop offset="1" stop-color="#33505f"/>
    </linearGradient>
  </defs>

  <!-- 定模座板 -->
  <g data-part="定模" data-material="steel" data-shade="flat">
    <rect x="10" y="18" width="24" height="74" rx="3" fill="url(#md-plate)" stroke="#5f93a8" stroke-width="1.2"/>
    <rect x="34" y="28" width="30" height="54" rx="2" fill="#41606f" stroke="#5f93a8" stroke-width="1.1"/>
    <!-- 型腔 -->
    <path d="M64 44 q-10 11 0 22" fill="#101d25" stroke="#78bed7" stroke-width="1.2"/>
    <!-- 浇口 -->
    <rect x="2" y="50" width="10" height="10" rx="2" fill="#5b7c8e" stroke="#5f93a8" stroke-width="1"/>
  </g>

  <!-- 分型面 -->
  <line x1="64" y1="14" x2="64" y2="96" stroke="#29d8f0" stroke-width="1" stroke-dasharray="4 3" opacity=".6"/>

  <!-- 动模 -->
  <g data-part="动模" data-material="steel" data-shade="flat">
    <path d="M96 44 q10 11 0 22" fill="#101d25" stroke="#78bed7" stroke-width="1.2"/>
    <rect x="96" y="28" width="30" height="54" rx="2" fill="#41606f" stroke="#5f93a8" stroke-width="1.1"/>
    <rect x="126" y="18" width="4" height="74" rx="2" fill="url(#md-plate)" stroke="#5f93a8" stroke-width="1"/>
    <!-- 顶针板 -->
    <rect x="100" y="38" width="22" height="3" fill="#9fd7ea" opacity=".5"/>
    <rect x="100" y="68" width="22" height="3" fill="#9fd7ea" opacity=".5"/>
  </g>

  <!-- 导柱导套 -->
  <g data-part="导柱" data-material="steel" data-shade="cylinder">
    <rect x="28" y="12" width="8" height="10" rx="3" fill="#7fa9bd"/>
    <rect x="28" y="88" width="8" height="10" rx="3" fill="#7fa9bd"/>
    <rect x="112" y="12" width="8" height="10" rx="3" fill="#7fa9bd"/>
    <rect x="112" y="88" width="8" height="10" rx="3" fill="#7fa9bd"/>
  </g>

  <!-- 冷却水嘴 -->
  <g data-part="冷却水路" data-material="brass" data-shade="cylinder">
    <rect x="34" y="20" width="12" height="5" rx="2" fill="#e8b64c" stroke="#a8842a" stroke-width="1"/>
    <rect x="34" y="85" width="12" height="5" rx="2" fill="#e8b64c" stroke="#a8842a" stroke-width="1"/>
  </g>
</svg>
