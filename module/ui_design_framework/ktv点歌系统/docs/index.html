<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0">
<title>AIR KTV 智能点歌系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
button,.ic{font-size:16px;font-family:inherit}
html,body{width:1024px;height:600px;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;font-size:16px;user-select:none;-webkit-user-select:none}
:root{--bg:#10131D;--nav:#171C29;--topbar:#141827;--mini:#161B29;--input:#121624;--card:#20283A;--card2:#252E42;--track:#2C3550;--tag:#28324A;--tag-text:#CBD3E2;--func:#2A3450;--text:#FFFFFF;--sub:#A7B0C0;--line:rgba(255,255,255,.07);--blue:#477BFF;--blue-hover:#5C8BFF;--purple:#7B61FF;--cyan:#19D5D0;--placeholder:#5C6678;--op-hover:#33405C;--del:#FF7B8A;--rank1:#FFD35C;--rank2:#C9D4E8;--rank3:#E7A46B;--toast-bg:rgba(20,26,42,.96);--sw-off:#C6D0E0;--glow-a:rgba(71,123,255,.22);--glow-b:rgba(123,97,255,.20);--glow-c:rgba(249,87,166,.13);--grid:rgba(180,205,255,.035);--glass:rgba(32,40,58,.70);--shadow:rgba(0,0,0,.35);--title-grad:linear-gradient(100deg,#8FB4FF,#B79BFF 55%,#6FE6E1);--title-stroke:rgba(255,255,255,.10)}
body[data-mode="light"]{--bg:#F2F4F9;--nav:#E8ECF5;--topbar:#FFFFFF;--mini:#FFFFFF;--input:#F4F6FB;--card:#FFFFFF;--card2:#F0F3FA;--track:#DDE3EF;--tag:#E9EDF6;--tag-text:#3A4560;--func:#E1E7F2;--text:#1A2233;--sub:#5A6680;--line:rgba(20,30,60,.10);--blue:#2F62E6;--blue-hover:#4A75EC;--purple:#6649E8;--cyan:#0E9E99;--placeholder:#9AA5BA;--op-hover:#DCE3F0;--del:#E0455C;--rank1:#D9A400;--rank2:#8492AC;--rank3:#B8753A;--toast-bg:rgba(255,255,255,.97);--sw-off:#C7D0E0;--glow-a:rgba(71,123,255,.30);--glow-b:rgba(140,100,255,.24);--glow-c:rgba(249,87,166,.18);--grid:rgba(70,100,180,.07);--glass:rgba(255,255,255,.78);--shadow:rgba(40,60,110,.14);--title-grad:linear-gradient(100deg,#2F62E6,#7B3FE4 55%,#0E9E99);--title-stroke:rgba(255,255,255,.55)}
body[data-theme="purple"]{--blue:#7B61FF;--purple:#477BFF;--cyan:#B98CFF}
body[data-theme="cyan"]{--blue:#19A7CE;--purple:#477BFF;--cyan:#19D5D0}
body[data-mode="light"][data-theme="purple"]{--blue:#6649E8;--purple:#2F62E6;--cyan:#9B5DE5}
body[data-mode="light"][data-theme="cyan"]{--blue:#0E9E99;--purple:#2F62E6;--cyan:#0BA8A3}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-fill{fill:currentColor;stroke:none}

#app{position:relative;width:1024px;height:600px;overflow:hidden;background:
 radial-gradient(760px 420px at 8% -12%,var(--glow-a),transparent 60%),
 radial-gradient(680px 440px at 100% 4%,var(--glow-b),transparent 58%),
 radial-gradient(620px 380px at 46% 116%,var(--glow-c),transparent 60%),
 var(--bg)}
/* 背景装饰层：网格 + 光斑 + 音符，纯 CSS，不拦截触摸 */
#app:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
 background-size:40px 40px;
 -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.25) 70%,transparent);
 mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.25) 70%,transparent)}
#bgdeco{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bgdeco .glow{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55}
#bgdeco .g1{width:360px;height:360px;left:-90px;top:-120px;background:radial-gradient(circle,var(--glow-a),transparent 68%)}
#bgdeco .g2{width:420px;height:420px;right:-120px;top:60px;background:radial-gradient(circle,var(--glow-b),transparent 68%)}
#bgdeco .g3{width:380px;height:380px;left:340px;bottom:-200px;background:radial-gradient(circle,var(--glow-c),transparent 68%)}
#bgdeco .ring{position:absolute;border:1px solid var(--line);border-radius:50%}
#bgdeco .r1{width:240px;height:240px;right:60px;top:96px;opacity:.5}
#bgdeco .r2{width:150px;height:150px;right:105px;top:141px;opacity:.4}
#bgdeco .note{position:absolute;fill:none;stroke:var(--cyan);stroke-width:1.8;opacity:.10}
#bgdeco .n1{right:120px;top:120px;width:70px;height:70px}
#bgdeco .n2{left:200px;bottom:110px;width:46px;height:46px;transform:rotate(-18deg)}
#bgdeco .wave{position:absolute;left:0;right:0;bottom:56px;height:70px;opacity:.16}
#bgdeco .wave path{fill:none;stroke:var(--cyan);stroke-width:2}
#stage{position:absolute;left:124px;top:58px;right:0;bottom:0;overflow:hidden;z-index:1}
#topbar{position:absolute;left:0;top:0;width:1024px;height:58px;background:linear-gradient(180deg,var(--topbar),var(--bg));border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;z-index:5;box-shadow:0 6px 24px var(--shadow)}
#topbar:after{content:"";position:absolute;left:0;bottom:-1px;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--blue),var(--purple),var(--cyan),transparent);opacity:.6;pointer-events:none}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;margin-right:12px}
.logo .ic{width:22px;height:22px;color:#fff}
.sys-name{font-size:19px;font-weight:700;letter-spacing:1px}
.sys-name small{font-size:16px;color:var(--sub);font-weight:400;margin-left:10px;letter-spacing:0}
.top-right{margin-left:auto;display:flex;align-items:center;gap:18px}
.room{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;font-size:16px;color:var(--sub)}
.room b{color:var(--cyan);font-size:16px}
.clockbox{display:flex;align-items:center;gap:10px;white-space:nowrap}
#clock{font-size:20px;font-weight:700;letter-spacing:1px;line-height:1}
#date{font-size:16px;color:var(--sub)}

#sidebar{position:absolute;left:0;top:58px;width:124px;bottom:84px;background:linear-gradient(180deg,var(--nav),var(--bg));border-right:1px solid var(--line);padding:14px 16px 0 8px;z-index:4;display:flex;flex-direction:column;align-items:flex-end}
.nav{width:100px;height:74px;margin:0 0 9px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);cursor:pointer;border:1px solid transparent;transition:background .15s,color .15s,box-shadow .15s,transform .15s}
.nav .ni{width:44px;height:44px;border-radius:14px;background:var(--nc);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.nav .ni .ic{width:26px;height:26px;stroke-width:2}
.nav:hover{background:var(--card2);color:var(--text);transform:translateY(-2px)}
.nav.active{background:linear-gradient(180deg,rgba(71,123,255,.26),rgba(123,97,255,.10));color:var(--text);border-color:rgba(71,123,255,.42);box-shadow:0 8px 20px rgba(71,123,255,.18)}
.nav.active .ni{box-shadow:0 8px 18px rgba(71,123,255,.55)}
.nav-txt{font-size:17px;font-weight:700}
.nav-foot{display:none}
.nav-foot b{display:block;color:var(--cyan);font-size:16px}

.page{position:absolute;left:0;top:0;right:0;bottom:84px;padding:14px 16px;overflow:hidden;display:none}
.page.active{display:block}
/* 可滑动列表：固定高度 + 常显滑动条 */
.yscroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--blue) var(--track)}
.yscroll::-webkit-scrollbar{width:8px}
.yscroll::-webkit-scrollbar-track{background:var(--track);border-radius:4px}
.yscroll::-webkit-scrollbar-thumb{background:var(--blue);border-radius:4px}
/* 自定义滚动条：长按滑块后拖动才滚动，短按不生效 */
.sb-wrap{position:relative;display:flex;min-height:0}
.sb-wrap>.yscroll{flex:1;min-width:0;width:100%;scrollbar-width:none!important}
.sb-wrap>.yscroll::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
.sb-track{width:12px;flex:none;position:relative;margin-left:4px;border-radius:6px;background:transparent}
.sb-thumb{position:absolute;left:1px;width:10px;border-radius:5px;background:var(--blue);cursor:grab;touch-action:none;min-height:30px;transition:background .15s;box-shadow:0 0 10px rgba(71,123,255,.35)}
.sb-thumb.drag{background:var(--cyan);cursor:grabbing}
.phead{display:flex;align-items:center;height:30px;margin-bottom:10px}
.phead h2{font-size:19px;font-weight:700}
.phead .bar{width:4px;height:18px;background:var(--blue);border-radius:2px;margin-right:10px}
.phead .desc{font-size:16px;color:var(--sub);margin-left:12px}
.phead .right{margin-left:auto;font-size:16px;color:var(--sub)}
.pback{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-right:10px;cursor:pointer;color:var(--sub)}
.pback:hover{color:var(--text);background:var(--card2)}
.pback .ic{width:18px;height:18px}

.cover{position:relative;border-radius:10px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -10px 22px rgba(0,0,0,.14),0 3px 10px var(--shadow)}
.cover:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 46%)}
.cv-glow{position:absolute;inset:0;pointer-events:none}
.cover .cv-pattern{position:absolute;inset:0;width:100%;height:100%}
.cover .cv-mark{position:relative;z-index:1;color:rgba(255,255,255,.96);font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.35);line-height:1}
.cover .cv-note{position:absolute;right:6px;bottom:4px;width:20px;height:20px;color:rgba(255,255,255,.62);z-index:1}
.addbtn{width:40px;height:40px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;border:none;flex:none}
.addbtn:hover{background:var(--blue-hover)}
.addbtn .ic{width:20px;height:20px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:18px;padding:8px 16px;font-size:16px;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--blue)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn{border:none;border-radius:9px;padding:0 18px;height:40px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;background:var(--blue)}
.btn.ghost{background:var(--card);color:var(--sub);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--text)}
.btn .ic{width:18px;height:18px}
.song-name{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-artist{font-size:16px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{outline:2px solid var(--cyan);outline-offset:-2px}
/* 商用质感：卡片悬浮发光与层次 */
.qcard,.songcard,.newcard,.cat-item,.setcard,.order-row,.rank-row,.pl-card,.pl-song,.result-box,.queue,.sumbar{transition:background .15s,box-shadow .15s}
.qcard:hover,.songcard:hover,.newcard:hover,.cat-item:hover,.pl-card:hover,.setcard:hover{box-shadow:0 8px 22px var(--shadow),0 0 0 1px var(--blue),0 0 18px rgba(71,123,255,.18)}
.nav.active{box-shadow:0 8px 20px rgba(71,123,255,.18),0 0 0 1px rgba(71,123,255,.35)}
.addbtn{box-shadow:0 4px 10px rgba(0,0,0,.22)}
.cbtn.main{box-shadow:0 8px 24px rgba(71,123,255,.35)}
/* 文字渐变渲染：标题 / 歌手名 / 主打歌名 */
.phead h2,.sec-title h3,.artist-card .an,.feature .ftitle,.play-info .ptitle,.pl-card .pn,.pl-head .pinfo .pn{
 background:var(--title-grad);-webkit-background-clip:text;background-clip:text;
 -webkit-text-fill-color:transparent;color:var(--blue);
 font-weight:800;letter-spacing:.3px;
}
#mname,.mmeta .song-name{background:var(--title-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--blue)}
.song-name{letter-spacing:.2px}

/* ---------- HOME ---------- */
.hero{display:flex;gap:12px;height:118px;margin-bottom:8px}
.feature{width:360px;height:118px;border-radius:14px;background:linear-gradient(120deg,#1E3A8A,#4C1D95 60%,#831843);position:relative;overflow:hidden;display:flex;align-items:center;padding:11px;cursor:pointer;flex:none;color:#FFFFFF;box-shadow:0 10px 26px rgba(30,20,80,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.feature:before{content:"";position:absolute;right:-30px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.20),transparent 66%);pointer-events:none}
.feature:after{content:"♫";position:absolute;right:16px;bottom:-24px;font-size:96px;line-height:1;color:rgba(255,255,255,.07);pointer-events:none}
.feature .fc{width:92px;height:92px;border-radius:12px;overflow:hidden;flex:none;position:relative}
.feature .finfo{margin-left:14px;z-index:1;min-width:0}
.feature .tag{display:inline-block;background:var(--cyan);color:#06121A;font-size:16px;font-weight:700;padding:3px 8px;border-radius:4px;margin-bottom:6px}
.feature .ftitle{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feature .fartist{font-size:16px;color:#D8DFF0;margin-top:5px}
.feature .fdesc{font-size:16px;color:#B9C4DE;margin-top:5px}
.feature .fadd{position:absolute;right:11px;bottom:11px;z-index:2}
.quick{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:6px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 12px;cursor:pointer}
.qcard:hover{background:var(--card2)}
.qcard .qi{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.qcard .qi .ic{width:20px;height:20px}
.qcard .qt{font-size:16px;font-weight:600}
.qcard .qs{font-size:16px;color:var(--sub);margin-top:2px}
.sec-title{display:flex;align-items:center;height:20px;margin-bottom:6px}
.sec-title h3{font-size:16px;font-weight:700}
.sec-title .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-right:9px}
.sec-title .more{margin-left:auto;font-size:16px;color:var(--sub);cursor:pointer}
.hot-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:10px}
.songcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px;position:relative;cursor:pointer}
.songcard:hover{background:var(--card2)}
.songcard .sc1{position:relative}
.songcard .addbtn{position:absolute;right:2px;bottom:2px;width:34px;height:34px;border-radius:9px}
.songcard .addbtn .ic{width:18px;height:18px}
.songcard .meta{margin-top:5px}
.new-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
/* 磁贴大厅：参考商用 KTV 大色块入口 */
.tile-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:14px;height:calc(100% - 182px)}
.tile{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px var(--shadow);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-4px);box-shadow:0 16px 32px var(--shadow)}
.tile:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);right:-60px;top:-70px}
.tile:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.14);left:-40px;bottom:-50px}
.tile .tic{width:66px;height:66px;border-radius:18px;background:rgba(255,255,255,.20);display:flex;align-items:center;justify-content:center;z-index:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.tile .tic .ic{width:36px;height:36px;stroke-width:1.6}
.tile .tt{font-size:20px;font-weight:800;z-index:1;letter-spacing:1px}
.tile .td{font-size:16px;z-index:1;opacity:.85}
.tile.hero-tile{grid-column:span 2}
.newcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px;display:flex;align-items:center;gap:8px;cursor:pointer;height:92px;position:relative}
.newcard:hover{background:var(--card2)}
.newcard .meta{flex:1;min-width:0;overflow:hidden}
.newcard .addbtn{position:absolute;left:45px;top:41px;width:30px;height:30px;border-radius:8px}
.newcard .addbtn .ic{width:16px;height:16px}

/* ---------- CATEGORY / ARTIST ---------- */
.split{display:flex;gap:12px;height:calc(100% - 40px)}
.cat-col{width:104px;flex:none;display:flex;flex-direction:column;gap:7px}
.cat-item{height:44px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:16px;cursor:pointer;color:var(--sub);white-space:nowrap}
.cat-item:hover{color:var(--text)}
.cat-item.on{background:linear-gradient(90deg,rgba(71,123,255,.3),rgba(123,97,255,.12));color:var(--text);border-color:rgba(71,123,255,.5)}
.grid-right{flex:1;min-width:0}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:120px;gap:9px;align-content:start;height:100%;padding-right:8px}
.cat-song{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;height:120px;cursor:pointer;position:relative}
.cat-song:hover{background:var(--card2)}
.cat-song .cover{margin-bottom:4px}
.cat-song .addbtn{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:9px}
.cat-song .song-name,.cat-song .song-artist{padding-right:40px}

.filterbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filterbar .lbl{font-size:16px;color:var(--sub);margin-right:2px}
.abc{display:flex;gap:4px;margin-left:8px}
.abc span{width:26px;height:26px;border-radius:6px;background:var(--card);color:var(--sub);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.abc span:hover,.abc span.on{background:var(--blue);color:#fff}
.abc span.all{width:44px}
.artist-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-content:start}
#p-artist .artist-grid{height:calc(100% - 116px);padding-right:8px}
.artist-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer}
.artist-card:hover{background:var(--card2)}
.artist-card .cover{margin:0 auto 8px;border-radius:50%}
.artist-card .an{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artist-card .ac{font-size:16px;color:var(--sub);margin-top:4px}

/* ---------- SEARCH ---------- */
.searchbar{display:flex;gap:10px;margin-bottom:12px}
.search-input{flex:1;height:48px;background:var(--input);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 14px;gap:10px}
.search-input .ic{color:var(--sub)}
.search-input input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:16px;font-family:inherit;width:100%}
.search-input input::placeholder{color:var(--placeholder)}
.searchbar .btn{height:48px;padding:0 26px;font-size:16px}
.ime-pill{height:32px;min-width:56px;padding:0 12px;border-radius:16px;background:var(--func);color:var(--cyan);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line)}
.ime-pill:hover{background:var(--blue);color:#fff}
.search-body{display:flex;gap:12px;height:calc(100% - 100px)}
.result-box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow:hidden}
.result-box .rt{font-size:16px;color:var(--sub);margin-bottom:6px}
.result-row{height:44px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);cursor:pointer}
.result-row:last-child{border-bottom:none}
.result-row:hover{background:rgba(71,123,255,.08)}
.result-row .rk{width:22px;text-align:center;font-size:16px;color:var(--sub)}
.result-row .cover{border-radius:6px}
.result-row .meta{flex:1;min-width:0}

/* ---------- ORDERED ---------- */

.fcard{height:48px;border-radius:11px;background:linear-gradient(145deg,rgba(71,123,255,.14),rgba(123,97,255,.08));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;color:var(--text)}

.info-row:last-child{border-bottom:none}

/* ---------- MINI PLAYER ---------- */
#mini{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--mini);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:3}

#mini .mtime{font-size:16px;color:var(--sub);width:104px;min-width:104px;text-align:center;white-space:nowrap}
#mini .mcnt{background:var(--card);border-radius:10px;padding:9px 12px;font-size:16px;color:var(--sub);cursor:pointer;white-space:nowrap}
#mini .mcnt b{color:var(--cyan);font-size:16px}
#mini .mfunc{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(71,123,255,.28),rgba(123,97,255,.2));border:1px solid rgba(71,123,255,.45);border-radius:10px;padding:9px 12px;font-size:16px;color:var(--text);cursor:pointer;white-space:nowrap}

.func-pop{display:none;position:absolute;left:50%;bottom:210px;transform:translateX(-50%);width:620px;background:var(--toast-bg);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 16px 40px var(--shadow);z-index:20}

.mrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}

.mrow .scale{display:flex;justify-content:space-between;font-size:16px;color:var(--sub);margin-top:8px}
.ac-ctl{display:flex;align-items:center;justify-content:center;gap:26px;padding:6px 0}
.ac-btn{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 16px rgba(71,123,255,.35)}

.ac-val{font-size:46px;font-weight:800;color:var(--text);min-width:130px;text-align:center}

.ac-val-sm{font-size:34px;font-weight:800;color:var(--text);min-width:80px;text-align:center;color:var(--cyan)}
.ac-state{text-align:center;font-size:17px;color:var(--sub);margin-top:2px}
/* 空调增强 */
.ac-power{display:flex;align-items:center;justify-content:space-between}
.ac-switch{width:64px;height:34px;border-radius:18px;background:var(--sw-off);position:relative;cursor:pointer;transition:background .18s;flex:none}
.ac-switch:after{content:"";position:absolute;left:3px;top:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .18s}
.ac-switch.on{background:linear-gradient(135deg,#477BFF,#7B61FF)}

.ac-label{font-size:16px;color:var(--text);font-weight:600}
.ac-cardsel{display:flex;align-items:center;gap:10px;margin-top:10px}
.ac-cardsel .cs-arrow{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));border:1px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex:none;box-shadow:0 6px 14px var(--shadow);transition:all .15s}

.ac-cardsel .cs-card:active{transform:scale(.98)}
.ac-cardsel .cs-card .ic{width:28px;height:28px;color:var(--cyan)}
.ac-cardsel .cs-card .cs-name{font-size:20px;font-weight:800}
.ac-cardsel .cs-card .cs-desc{font-size:16px;color:var(--sub);font-weight:400}
.ac-dots{display:flex;justify-content:center;gap:8px;margin-top:8px}
.ac-dots .dot{width:8px;height:8px;border-radius:50%;background:var(--card2);cursor:pointer;transition:all .15s}
.ac-dots .dot.on{width:22px;border-radius:5px;background:var(--blue)}
.ac-temp-off{opacity:.45;pointer-events:none}

function toggleIme(){
 state.ime=state.ime==='cn'?'en':'cn';
 state.pinyin='';state.candPage=0;state.kbSym=false;
 renderSearch();
 toast(state.ime==='cn'?'已切换中文拼音输入':'已切换英文输入');
}
function candList(){
 var py=state.pinyin.toLowerCase();if(!py)return [];
 var arr=(PINYIN[py]||[]).slice();
 if(!arr.length){Object.keys(PINYIN).forEach(function(k){if(k.indexOf(py)===0){PINYIN[k].forEach(function(c){if(arr.indexOf(c)<0&&arr.length<24)arr.push(c);});}});}
 if(!arr.length)arr=[py];
 return arr;
}
function renderCand(){
 var box=document.getElementById('candbar');if(!box)return;
 var arr=candList(),per=8,pages=Math.max(1,Math.ceil(arr.length/per));
 state.candPage=Math.max(0,Math.min(state.candPage,pages-1));
 var chunk=arr.slice(state.candPage*per,state.candPage*per+per);
 var h='<div class="cand-py">'+(state.pinyin||'拼音')+'</div>';
 h+='<div class="cand-arrow" data-act="candPage" data-v="-1">‹</div><div class="cand-list">';
 if(!state.pinyin)h+='<div class="cand-tip">输入拼音后在这里选字</div>';
 else chunk.forEach(function(c){h+='<div class="cand-item'+(c===chunk[0]?' on':'')+'" data-act="cand" data-v="'+c+'">'+c+'</div>';});
 h+='</div><div class="cand-arrow" data-act="candPage" data-v="1">›</div>';
 box.innerHTML=h;
}
function syncInput(){
 var inp=document.getElementById('sinput');if(!inp)return;
 inp.value=state.query+state.pinyin;
 try{inp.setSelectionRange(inp.value.length,inp.value.length);}catch(e){}
}
function commitCand(c){state.query+=c;state.pinyin='';state.candPage=0;syncInput();renderCand();refreshResults();}

 var lower=state.ime==='cn'?true:state.kbLower;
 var imeKey={t:state.ime==='cn'?'EN':'中',v:'IME',c:'fp'};
 function L(s){return lower?s.toLowerCase():s;}
 if(state.kbSym)return [
  [imeKey,{t:'ABC',v:'ABC',c:'fp'},'1','2','3','4','5','6','7','8','9','0',{t:'退格',v:'DEL',c:'fp'}],
  ['-','/',';','(',')','&','@','.',',','?',{t:'搜索',v:'DO',c:'fp'}],
  [{t:'空格',v:'SPACE',c:'fw'},'!','"',':','+','*','=','_',{t:'清空',v:'CLEAR',c:'fw'}]
 ];
 return [
  [{t:'1#',v:'SYM',c:'fp'},L('Q'),L('W'),L('E'),L('R'),L('T'),L('Y'),L('U'),L('I'),L('O'),L('P'),{t:'退格',v:'DEL',c:'fp'}],
  [imeKey,{t:lower?'abc':'ABC',v:'ABC',c:'fp'},L('A'),L('S'),L('D'),L('F'),L('G'),L('H'),L('J'),L('K'),L('L'),{t:'搜索',v:'DO',c:'fp'}],

 ];

/* 自定义滚动条：长按滑块 350ms 后进入拖动模式，短按不生效 */
function setupScrollBars(){
 var nodes=document.querySelectorAll('.yscroll');
 for(var n=0;n<nodes.length;n++)(function(sc){
  if(sc.getAttribute('data-sb'))return;
  sc.setAttribute('data-sb','1');
  var cs=window.getComputedStyle(sc);
  var wrap=document.createElement('div');wrap.className='sb-wrap';
  var grow=parseFloat(cs.flexGrow)||0;
  if(grow>0){wrap.style.flex=cs.flexGrow+' '+cs.flexShrink+' '+cs.flexBasis;wrap.style.minHeight='0';sc.style.flex='none';}
  else{wrap.style.height=Math.round(sc.getBoundingClientRect().height)+'px';}
  sc.style.height='100%';
  if(sc.parentNode)sc.parentNode.insertBefore(wrap,sc);
  wrap.appendChild(sc);
  var track=document.createElement('div');track.className='sb-track';
  var thumb=document.createElement('div');thumb.className='sb-thumb';
  track.appendChild(thumb);wrap.appendChild(track);
  function upd(){
   var ch=sc.clientHeight,sh=sc.scrollHeight,max=sh-ch;
   var th=Math.max(30,Math.round(ch*ch/Math.max(sh,1)));
   if(th>ch)th=ch;
   thumb.style.height=th+'px';
   var range=Math.max(0,ch-th);
   var top=max>0?Math.round(sc.scrollTop/max*range):0;
   thumb.style.top=top+'px';
   track.style.display=max>1?'block':'none';
  }
  sc.addEventListener('scroll',upd);
  var holding=false,active=false,sy=0,st=0,timer=null;
  function down(e){
   if(e.button!==undefined&&e.button!==0)return;
   e.preventDefault();e.stopPropagation();
   holding=true;active=false;sy=e.clientY;st=parseFloat(thumb.style.top)||0;
   timer=setTimeout(function(){if(holding){active=true;thumb.classList.add('drag');}},350);
   try{thumb.setPointerCapture(e.pointerId);}catch(err){}
  }
  function move(e){
   if(!holding||!active)return;
   e.preventDefault();e.stopPropagation();
   var dy=e.clientY-sy,ch=sc.clientHeight,sh=sc.scrollHeight,th=thumb.offsetHeight;
   var range=Math.max(0,ch-th),max=Math.max(0,sh-ch);
   var nt=Math.max(0,Math.min(range,st+dy));
   thumb.style.top=nt+'px';
   sc.scrollTop=max>0?nt/range*max:0;
  }
  function up(){clearTimeout(timer);holding=false;active=false;thumb.classList.remove('drag');}
  thumb.addEventListener('pointerdown',down);
  thumb.addEventListener('pointermove',move);
  thumb.addEventListener('pointerup',up);
  thumb.addEventListener('pointercancel',up);
  window.addEventListener('pointerup',up);
  upd();setTimeout(upd,0);
 })(nodes[n]);
}

   h+='<div class="cs-arrow" data-act="'+act+'Prev">'+ic('back')+'</div>';
   h+='<div class="cs-card" data-act="'+act+'Cycle">'+ic(it[2])+'<span class="cs-name">'+it[1]+'</span>'+(desc?'<span class="cs-desc">'+desc+'</span>':'')+'</div>';
   h+='<div class="cs-arrow" data-act="'+act+'Next" style="transform:rotate(180deg)">'+ic('back')+'</div>';
   h+='</div><div class="ac-dots">';
   items.forEach(function(p,k){h+='<div class="dot'+(k===idx?' on':'')+'" data-act="'+act+'Set" data-v="'+k+'"></div>';});
   h+='</div>';
   return h;
  }
  body='<div class="mrow"><div class="ac-power"><span class="ac-label">空调电源</span><div class="ac-switch'+(state.acOn?' on':'')+'" data-act="acToggle"></div></div><div class="ac-state" id="acState">'+acStatus()+'</div></div>';
  body+='<div class="mrow'+(state.acOn?'':' ac-temp-off')+'" id="acModeRow"><div class="ml"><span>运行模式</span><b id="acModeLbl">'+modes.filter(function(m){return m[0]===state.acMode;})[0][1]+'</b></div>'+cardSel(modes,state.acMode,'acMode')+'</div>';
  body+='<div class="mrow'+(state.acOn?'':' ac-temp-off')+'" id="acFanRow"><div class="ml"><span>风速大小</span><b id="acFanLbl">'+fans.filter(function(f){return f[0]===state.acFan;})[0][1]+'</b></div>'+cardSel(fans,state.acFan,'acFan')+'</div>';
  body+='<div class="mrow'+(state.acOn?'':' ac-temp-off')+'" id="acTempRow"><div class="ml"><span>温度设置</span><b><span id="acVal">'+state.acTemp+'</span>°C</b></div><div class="ac-ctl"><div class="ac-btn" data-act="acDown">−</div><div class="ac-val-sm">'+state.acTemp+'°</div><div class="ac-btn" data-act="acUp">＋</div></div></div>';
 }
 var mt=document.getElementById('modalTitle'),mb=document.getElementById('modalBody');
 if(mt)mt.textContent=title;if(mb)mb.innerHTML=body;
 var mask=document.getElementById('modalMask'),modal=document.getElementById('modal');
 if(mask)mask.classList.add('show');if(modal)modal.classList.add('show');
}
function closeModal(){
 var mask=document.getElementById('modalMask'),modal=document.getElementById('modal');
 if(mask)mask.classList.remove('show');if(modal)modal.classList.remove('show');
 state.eqOpen=false;state.acOpen=false;
 var fb=document.getElementById('funcPopBody');if(fb&&fb.innerHTML)fb.innerHTML=funcCards();
 if(state.page==='playing')renderPlaying();
}
function applySlider(act,pct){
 if(act==='seek'){state.progress=pct;updateProgress();}
 if(act==='volume'){state.volume=pct;var vf=document.getElementById('vfill');if(vf)vf.style.width=pct+'%';var vt=document.getElementById('vtxt');if(vt)vt.textContent=pct+'%';}
 if(act==='setVol'){state.volume=pct;var sv=document.getElementById('setVol');if(sv)sv.textContent=pct+'%';var sf=document.getElementById('setVolFill');if(sf)sf.style.width=pct+'%';var ev=document.getElementById('eqVolVal');if(ev)ev.textContent=pct+'%';var ef=document.getElementById('eqVolFill');if(ef)ef.style.width=pct+'%';}
 if(act==='setBri'){state.brightness=pct;var sb=document.getElementById('setBri');if(sb)sb.textContent=pct+'%';var sbf=document.getElementById('setBriFill');if(sbf)sbf.style.width=pct+'%';setDim();}
 if(act==='pitch'){state.pitch=pct;var pv=document.getElementById('pitchVal');if(pv)pv.textContent=pct;var pf=document.getElementById('pitchFill');if(pf)pf.style.width=pct+'%';}
 if(act==='micVol'){state.micVol=pct;var mv=document.getElementById('micVal');if(mv)mv.textContent=pct+'%';var mf=document.getElementById('micFill');if(mf)mf.style.width=pct+'%';}
}
/* 进度/音量/亮度：按住即可连续拖动，非单点 */
var sliderDrag=null,SLIDER_ACTS=',seek,volume,setVol,setBri,pitch,micVol,';
function sliderPct(el,cx){var r=el.getBoundingClientRect();return Math.max(0,Math.min(100,Math.round((cx-r.left)/r.width*100)));}
document.addEventListener('pointerdown',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;
 var act=el.getAttribute('data-act')||'';
 if(SLIDER_ACTS.indexOf(','+act+',')<0)return;
 sliderDrag=el;applySlider(act,sliderPct(el,e.clientX));
 try{el.setPointerCapture(e.pointerId);}catch(err){}
},true);
document.addEventListener('pointermove',function(e){
 if(!sliderDrag)return;
 applySlider(sliderDrag.getAttribute('data-act'),sliderPct(sliderDrag,e.clientX));
},true);
function endSliderDrag(){sliderDrag=null;}
window.addEventListener('pointerup',endSliderDrag);
window.addEventListener('pointercancel',endSliderDrag);

/* ============ 事件 ============ */
document.addEventListener('click',function(e){
 var nav=e.target.closest('[data-nav]');if(nav){go(nav.getAttribute('data-nav'));return;}
 var el=e.target.closest('[data-act]');if(!el)return;
 var act=el.getAttribute('data-act'),i=parseInt(el.getAttribute('data-i')),v=el.getAttribute('data-v');
 if(act==='add'){addSong(i);return;}
 if(act==='cat'){state.cat=i;renderCategory();return;}
 if(act==='af'){state.artistFilter=v;renderArtist();return;}
 if(act==='al'){state.artistLetter=v;renderArtist();var ag=document.querySelector('#p-artist .artist-grid');if(ag)ag.scrollTop=0;return;}
 if(act==='artist'){toast(ARTISTS[i].n+' · 共 '+ARTISTS[i].c+' 首可点歌曲');return;}
 if(act==='fill'){state.query=v;state.pinyin='';state.candPage=0;renderSearch();return;}
 if(act==='ime'){toggleIme();return;}
 if(act==='cand'){commitCand(v);return;}
 if(act==='candPage'){state.candPage=Math.max(0,state.candPage+(parseInt(v)||0));renderCand();return;}
 if(act==='key'){
  if(v==='IME'){toggleIme();return;}
  if(v==='SYM'){state.kbSym=true;renderSearch();return;}
  if(v==='ABC'){if(state.kbSym){state.kbSym=false;}else{state.kbLower=!state.kbLower;}renderSearch();return;}
  if(v==='DO'){
   if(state.pinyin)commitCand(candList()[0]);
   var r=searchResult();toast(r.length?'找到 '+r.length+' 首相关歌曲':'没有找到相关歌曲');return;
  }
  if(v==='DEL'){
   if(state.ime==='cn'&&state.pinyin){state.pinyin=state.pinyin.slice(0,-1);state.candPage=0;syncInput();renderCand();refreshResults();return;}
   state.query=state.query.slice(0,-1);
  }
  else if(v==='CLEAR'){state.query='';state.pinyin='';state.candPage=0;}
  else if(v==='SPACE'){
   if(state.ime==='cn'&&state.pinyin){commitCand(candList()[0]);return;}
   state.query+=' ';
  }
  else if(state.ime==='cn'&&/^[a-zA-Z]$/.test(v)){
   state.pinyin+=v.toLowerCase();state.candPage=0;syncInput();renderCand();refreshResults();return;
  }
  else state.query+=v;
  state.candPage=0;syncInput();renderCand();refreshResults();return;
 }
 if(act==='doSearch'){var r=searchResult();toast(r.length?'找到 '+r.length+' 首相关歌曲':'没有找到相关歌曲');return;}
 if(act==='rank'){state.rank=v;renderRank();return;}
 if(act==='pl'){state.plDetail=i;renderPlaylist();return;}
 if(act==='plBack'){state.plDetail=-1;renderPlaylist();return;}
 if(act==='pin'){if(i>0){var it=state.ordered.splice(i,1)[0];state.ordered.unshift(it);toast('已置顶《'+SONGS[it.i].n+'》');}else toast('该歌曲已在首位');renderOrdered();return;}
 if(act==='del'){var d=state.ordered.splice(i,1)[0];toast('已删除《'+SONGS[d.i].n+'》');renderOrdered();document.getElementById('miniCount').textContent=state.ordered.length;return;}
 if(act==='clearOrder'){state.ordered=[];toast('点歌列表已清空');renderOrdered();document.getElementById('miniCount').textContent=0;return;}
 if(act==='prev'){changeSong(-1);return;}
 if(act==='next'){changeSong(1);return;}
 if(act==='toggle'){togglePlay();return;}
 if(act==='funcPop'){
  var pop=document.getElementById('funcPop'),body=document.getElementById('funcPopBody');
  if(body&&!body.innerHTML)body.innerHTML=funcCards();
  if(pop)pop.classList.toggle('show');
  return;
 }
 if(act==='funcClose'){var p=document.getElementById('funcPop');if(p)p.classList.remove('show');return;}
 if(act==='func'){
  if(v==='next'){changeSong(1);return;}
  if(v==='toggle'){togglePlay();return;}
  if(v==='replay'){state.progress=0;updateProgress();toast('重唱《'+SONGS[state.playIndex].n+'》已从头开始');return;}
  if(v==='mute'){state.mute=!state.mute;toast(state.mute?'已静音':'已取消静音');}
  else if(v==='origin'){state.origin=!state.origin;toast(state.origin?'已切换原唱':'已切换伴唱');}
  else if(v==='atmos'){state.atmos=!state.atmos;toast(state.atmos?'氛围灯已开启':'氛围灯已关闭');}
  else if(v==='eq'){state.eqOpen=!state.eqOpen;if(state.eqOpen)openModal('eq');else closeModal();}
  else if(v==='control'){state.acOpen=!state.acOpen;if(state.acOpen)openModal('ac');else closeModal();}
  if(state.page==='playing')renderPlaying();
  var fb=document.getElementById('funcPopBody');if(fb)fb.innerHTML=funcCards();
  return;
 }
 if(act==='modalClose'){closeModal();return;}
 if(act==='acUp'||act==='acDown'){
  state.acTemp=Math.max(16,Math.min(30,state.acTemp+(act==='acUp'?1:-1)));
  var av=document.getElementById('acVal');if(av)av.textContent=state.acTemp;
  var avs=document.querySelector('.ac-val-sm');if(avs)avs.textContent=state.acTemp+'°';
  var ast=document.getElementById('acState');if(ast)ast.textContent=acStatus();
  toast('空调温度：'+state.acTemp+'°C');return;
 }
 if(act==='acToggle'){
  state.acOn=!state.acOn;
  openModal('ac');
  toast(state.acOn?'空调已开启':'空调已关闭');return;
 }
 if(act.indexOf('acMode')===0||act.indexOf('acFan')===0){
  var isMode=act.indexOf('acMode')===0;
  var arr=isMode?[['cool','制冷'],['heat','制热'],['fan','送风'],['dry','除湿']]:[['auto','自动'],['low','低速'],['mid','中速'],['high','高速']];
  var cur=isMode?state.acMode:state.acFan;
  var idx=0;arr.forEach(function(it,k){if(it[0]===cur)idx=k;});
  if(act.indexOf('Prev')>=0)idx=(idx-1+arr.length)%arr.length;
  else if(act.indexOf('Next')>=0)idx=(idx+1)%arr.length;
  else if(act.indexOf('Cycle')>=0)idx=(idx+1)%arr.length;
  else if(act.indexOf('Set')>=0)idx=parseInt(v)||0;
  if(isMode)state.acMode=arr[idx][0];else state.acFan=arr[idx][0];
  openModal('ac');
  toast((isMode?'模式：':'风速：')+arr[idx][1]);return;
 }
 if(act==='seek'||act==='volume'||act==='setVol'||act==='setBri'||act==='pitch'||act==='micVol'){
  applySlider(act,sliderPct(el,e.clientX));return;
 }
 if(act==='theme'){
   if(v===state.theme){toast('当前已选中该配色');return;}
   state.theme=v;setTheme();
   var els=document.querySelectorAll('#p-settings [data-act="theme"]');
   for(var i=0;i<els.length;i++){els[i].classList.toggle('on',els[i].getAttribute('data-v')===v);}
   toast('配色已切换');return;
 }
 if(act==='mode'){
   if(v===state.mode){toast(v==='dark'?'当前已是深色模式':'当前已是浅色模式');return;}
   state.mode=v;setTheme();
   var mes=document.querySelectorAll('#p-settings [data-act="mode"]');
   for(var mi=0;mi<mes.length;mi++){mes[mi].classList.toggle('on',mes[mi].getAttribute('data-v')===v);}
   toast(v==='dark'?'已切换深色模式':'已切换浅色模式');return;
 }
 if(act==='reset'){state.volume=64;state.brightness=100;state.theme='blue';state.mode='dark';setTheme();setDim();renderSettings();toast('已恢复默认设置');return;}
});
document.addEventListener('click',function(e){
 var s=e.target.closest('[data-song]');if(!s)return;
 if(e.target.closest('[data-act]'))return;
 state.selected=parseInt(s.getAttribute('data-song'));
 document.querySelectorAll('.page.active [data-song]').forEach(function(x){x.classList.remove('sel');});
 s.classList.add('sel');
});

/* ============ 时钟与模拟进度 ============ */
function tick(){
 var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
 document.getElementById('clock').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
 var wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
 document.getElementById('date').textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+wk;
}
setInterval(tick,1000);tick();
setInterval(function(){if(state.playing){state.progress=(state.progress+1)%101;updateProgress();}},1500);

setTheme();setDim();go('home');updateMini();
</script>
</body>
</html>
