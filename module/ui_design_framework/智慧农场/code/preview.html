<meta charset="UTF-8">
<title>智慧养殖场 · AirUI 预览 (800x480)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#020604; overflow:hidden; user-select:none;
    display:flex; align-items:center; justify-content:center;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  }
  #stage { width:800px; transform-origin:center center; }
  #screen {

    border-radius:10px;
    box-shadow:0 0 46px rgba(78,230,176,.18), 0 0 0 1px #1b4a38;

      radial-gradient(900px 500px at 15% 0%, rgba(140,255,200,.16), transparent 60%),

  .deco.tr { right:3px; top:3px;   border-right:2px solid #4EE6B0; border-top:2px solid #4EE6B0; }
  .deco.bl { left:3px; bottom:3px; border-left:2px solid #4EE6B0; border-bottom:2px solid #4EE6B0; }
  .deco.br { right:3px; bottom:3px;border-right:2px solid #4EE6B0; border-bottom:2px solid #4EE6B0; }

    position:absolute; left:0; top:0; width:100%; height:36px;

  .logochip {
    width:21px; height:21px; border-radius:5px; margin-right:8px;
    background:rgba(78,230,176,.16); border:1px solid rgba(78,230,176,.75);

    box-shadow:0 0 8px rgba(78,230,176,.35);

    text-shadow:0 0 12px rgba(78,230,176,.85); }
  .hline { flex:1; height:2px; margin:0 12px;

  .panel::before { left:-1px; top:-1px;    border-left:2px solid #4EE6B0; border-top:2px solid #4EE6B0; }
  .panel::after  { right:-1px; top:-1px;   border-right:2px solid #4EE6B0; border-top:2px solid #4EE6B0; }

  .dleg { flex:1; display:flex; flex-direction:column; justify-content:center;

  .mcol { display:flex; flex-direction:column; align-items:center; min-width:0; }

<script>/* 调色板（参考效果图取色） */
const C = {
  mint:'#4EE6B0', mint2:'#23C98A', orange:'#FFA14A', pink:'#FF4FA0',
  yellow:'#FFD34D', blue:'#4F8CFF', purple:'#8B7BFF', cyan:'#35D0E0',
  red:'#FF6B6B', text:'#F2FFF9', sub:'#9ED4BC',
  grid:'rgba(190,235,210,.32)', axis:'rgba(158,212,188,.60)',
};
const PAD = 6, NAV_H = 38;

/* 虚拟数据（随机游走） */
const st = {};
function next(key, min, max, drift) {
  let v = st[key]; if (v == null) v = (min + max) / 2;
  drift = drift ?? (max - min) / 20;
  v += (Math.random() * 2 - 1) * drift;
  v = Math.max(min, Math.min(max, v)); st[key] = v; return v;
}
function rint(key, min, max, drift) { return Math.round(next(key, min, max, drift)); }
function fmt(v, dec = 1) { return v.toFixed(dec); }
function series(key, min, max, n, base) {
  let v = base ?? next(key, min, max); const t = [];
  for (let i = 0; i < n; i++) {
    v += (Math.random() * 2 - 1) * (max - min) / 8;
    v = Math.max(min, Math.min(max, v)); t.push(Math.round(v));
  }
  return t;
}

/* ================= 布局与渲染 ================= */
function cellRect(i) {
  const col = (i - 1) % 2, row = Math.floor((i - 1) / 2);
  const pw = Math.floor((800 - PAD * 3) / 2);
  const ph = Math.floor((480 - NAV_H - PAD * 3) / 3);
  return { x: PAD + col * (pw + PAD), y: PAD + row * (ph + PAD), w: pw, h: ph };
}
let tickers = [], charts = [];

function el(tag, cls, style) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (style) for (const k in style) d.style[k] = style[k];
  return d;
}
function drawPanel(r, p) {
  const d = el('div', 'panel',
    { left:r.x+'px', top:r.y+'px', width:r.w+'px', height:r.h+'px' });
  const head = el('div', 'phead');
  const icon = el('div', 'picon'); icon.textContent = p.ic || '◆';
  const title = el('div', 'ptitle'); title.textContent = p.t;
  head.appendChild(icon); head.appendChild(title);
  d.appendChild(head);
  d.appendChild(el('i', 'bk'));
  const b = el('div', 'pbody');
  d.appendChild(b);
  document.getElementById('content').appendChild(d);
  return b;
}

  grid.style.gridTemplateRows = 'repeat(' + rows + ',1fr)';

    card.appendChild(circ); card.appendChild(col);

    tickers.push(() => { val.textContent = it.f(); });
  });
  a.appendChild(grid);
}

function addChart(a, p) {
  const cv = document.createElement('canvas');
  cv.style.width = '100%'; cv.style.height = '100%';
  a.appendChild(cv);
  p.series.forEach(s => { s.vals = s.gen(); });
  charts.push({ cv: cv, def: p, type: 'c' });
  setTimeout(() => { fitCanvas(cv); drawChart(cv, p); }, 0);
}
function fitCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return false;
  cv._w = w; cv._h = h; cv._dpr = dpr;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  return true;
}
function drawChart(cv, p) {
  const ctx = cv.getContext('2d');
  if (!cv._w) return;
  const dpr = cv._dpr, W = cv._w, H = cv._h;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const hasLegend = p.series.length > 1;
  const padL = 34, padR = 8;
  const padT = p.ulabel ? 24 : (hasLegend ? 16 : 6);
  const padB = p.cats ? 20 : 12;
  const pw = W - padL - padR, ph = H - padT - padB;
  if (pw <= 0 || ph <= 0) return;
  /* 虚线网格 */
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
  ctx.beginPath();
  for (let i = 1; i <= 3; i++) {
    const y = Math.round(padT + ph * i / 3) + 0.5;
    ctx.moveTo(padL, y); ctx.lineTo(padL + pw, y);
  }
  ctx.stroke(); ctx.setLineDash([]);
  /* 底部轴线 */
  ctx.strokeStyle = C.axis;
  ctx.beginPath();
  ctx.moveTo(padL, Math.round(padT + ph) + 0.5);
  ctx.lineTo(padL + pw, Math.round(padT + ph) + 0.5);
  ctx.stroke();
  /* Y轴刻度 */
  ctx.fillStyle = C.sub; ctx.font = '9px Consolas,monospace';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const v = p.ymax * i / 4;
    ctx.fillText(v.toFixed(0), padL - 5, padT + ph * (1 - i / 4));
  }
  /* 左上角标签 / 图例 */
  if (p.ulabel) {
    ctx.fillStyle = '#CFEBDC'; ctx.font = '10px "Microsoft YaHei"';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(p.ulabel, 6, 11);
  }
  if (hasLegend) {
    ctx.font = '10px "Microsoft YaHei"'; ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    let x = W - 6;
    for (let i = p.series.length - 1; i >= 0; i--) {
      const s = p.series[i];
      ctx.fillStyle = C.text;
      ctx.fillText(s.n || '', x, padT - 4);
      x -= ctx.measureText(s.n || '').width + 4;
      ctx.fillStyle = s.color; ctx.fillRect(x - 8, padT - 12, 8, 8);
      x -= 20;
    }
  }
  /* X轴类别 */
  if (p.cats) {
    ctx.fillStyle = C.sub; ctx.font = '10px "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const slot = pw / p.cats.length;
    p.cats.forEach((c, i) => ctx.fillText(c, padL + slot * (i + 0.5), padT + ph + 14));
  }
  if (p.ctype === 'line') drawLines(ctx, p, padL, padT, pw, ph);
  else drawBars(ctx, p, padL, padT, pw, ph);
}
function drawLines(ctx, p, padL, padT, pw, ph) {
  p.series.forEach(s => {
    const vals = s.vals, n = vals.length;
    const pt = i => [ padL + pw * i / (n - 1),
      padT + ph * (1 - Math.min(vals[i] / p.ymax, 1)) ];
    const grad = ctx.createLinearGradient(0, padT, 0, padT + ph);
    grad.addColorStop(0, s.color + '3E');
    grad.addColorStop(1, s.color + '08');
    ctx.beginPath();
    ctx.moveTo(padL, padT + ph);
    for (let i = 0; i < n; i++) { const q = pt(i); ctx.lineTo(q[0], q[1]); }
    ctx.lineTo(padL + pw, padT + ph); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const q = pt(i); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); }
    ctx.strokeStyle = s.color; ctx.lineWidth = 2;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.shadowColor = s.color; ctx.shadowBlur = 5;
    ctx.stroke(); ctx.shadowBlur = 0;
    for (let i = 0; i < n; i += 1) {
      const q = pt(i);
      ctx.beginPath(); ctx.arc(q[0], q[1], 3, 0, 6.3);
      ctx.fillStyle = s.color; ctx.fill();
      ctx.beginPath(); ctx.arc(q[0], q[1], 1.3, 0, 6.3);
      ctx.fillStyle = '#1A5A42'; ctx.fill();
    }
  });
}
function drawBars(ctx, p, padL, padT, pw, ph) {
  const ns = p.series.length, n = p.cats ? p.cats.length : p.series[0].vals.length;
  const groupW = pw / n;
  const bw = Math.max(Math.min(groupW / (ns + 0.6), 16), 4);
  p.series.forEach((s, si) => {
    const vals = s.vals;
    for (let i = 0; i < n; i++) {
      const bh = ph * Math.min(vals[i] / p.ymax, 1);
      const x = padL + groupW * i + groupW / 2 + (si - (ns - 1) / 2) * (bw + 3) - bw / 2;
      const y = padT + ph - bh;
      const grad = ctx.createLinearGradient(0, y, 0, y + bh);
      grad.addColorStop(0, s.color + 'E0');
      grad.addColorStop(1, s.color + '22');
      ctx.fillStyle = grad;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, bw, bh, [3, 3, 0, 0]);
      else ctx.rect(x, y, bw, bh);
      ctx.fill();
    }
  });
}/* 环形图 */
function addDonut(a, p) {
  const wrap = el('div', 'dcwrap');
  const cv = document.createElement('canvas');
  wrap.appendChild(cv);
  const leg = el('div', 'dleg');
  p.cats.forEach(c => {
    const r = el('div', 'dr');
    const i = el('i'); i.style.background = c.c;
    const n = el('span'); n.textContent = c.n;
    const v = el('span', 'dv'); v.textContent = c.t;
    r.appendChild(i); r.appendChild(n); r.appendChild(v);
    leg.appendChild(r);
  });
  wrap.appendChild(leg);
  a.appendChild(wrap);
  charts.push({ cv: cv, def: p, type: 'd' });
  setTimeout(() => { fitCanvas(cv); drawDonut(cv, p); }, 0);
}
function drawDonut(cv, def) {
  const ctx = cv.getContext('2d');
  if (!cv._w) return;
  const dpr = cv._dpr, W = cv._w, H = cv._h;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) / 2 - 6, ring = R * 0.30;
  const total = def.cats.reduce((s, c) => s + c.pc, 0);
  let ang = -Math.PI / 2;
  ctx.lineWidth = ring; ctx.lineCap = 'round';
  def.cats.forEach(c => {
    const sweep = c.pc / total * Math.PI * 2;
    ctx.beginPath();
    ctx.strokeStyle = c.c;
    ctx.shadowColor = c.c; ctx.shadowBlur = 9;
    ctx.arc(cx, cy, R - ring / 2, ang + 0.045, ang + sweep - 0.045);
    ctx.stroke();
    ang += sweep;
  });
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.text; ctx.font = 'bold 21px Consolas,monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(def.center.v, cx, cy + 3);
  ctx.fillStyle = C.sub; ctx.font = '10px "Microsoft YaHei"';
  ctx.fillText(def.center.n, cx, cy + 17);
}

function addRadar(a, p) {
  const wrap = el('div', 'dcwrap');

    leg.appendChild(r);
  });
  wrap.appendChild(leg);
  a.appendChild(wrap);
  p.series.forEach(s => { s.vals = s.gen(); });
  charts.push({ cv: cv, def: p, type: 'r' });
  setTimeout(() => { fitCanvas(cv); drawRadar(cv, p); }, 0);
}
function drawRadar(cv, def) {
  const ctx = cv.getContext('2d');
  if (!cv._w) return;
  const dpr = cv._dpr, W = cv._w, H = cv._h;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2 + 2;
  const R = Math.min(W, H) / 2 - 18;
  const n = def.cats.length;
  const angOf = i => -Math.PI / 2 + i * Math.PI * 2 / n;
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  for (let k = 1; k <= 4; k++) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = angOf(i % n);
      const q = [cx + R * k / 4 * Math.cos(a), cy + R * k / 4 * Math.sin(a)];
      if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]);
    }
    ctx.stroke();
  }
  for (let i = 0; i < n; i++) {
    const a = angOf(i);
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
    ctx.stroke();
  }
  ctx.fillStyle = '#CFEBDC'; ctx.font = '10px "Microsoft YaHei"';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const a = angOf(i);
    ctx.fillText(def.cats[i], cx + (R + 12) * Math.cos(a), cy + (R + 12) * Math.sin(a));
  }
  def.series.forEach(s => {
    const vals = s.vals;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const j = i % n, a = angOf(j);
      const r = R * Math.min(vals[j] / def.ymax, 1);
      const q = [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]);
    }
    ctx.closePath();
    ctx.fillStyle = s.color + '2C'; ctx.fill();
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.6;
    ctx.shadowColor = s.color; ctx.shadowBlur = 4;
    ctx.stroke(); ctx.shadowBlur = 0;
    for (let i = 0; i < n; i++) {
      const a = angOf(i);
      const r = R * Math.min(vals[i] / def.ymax, 1);
      ctx.beginPath();
      ctx.arc(cx + r * Math.cos(a), cy + r * Math.sin(a), 2.2, 0, 6.3);
      ctx.fillStyle = s.color; ctx.fill();
    }
  });
}/* 顶部导航与页面构建 */
function buildNav() {
  const bar = document.getElementById('navbar');
  const s = el('span', 'slashes'); s.textContent = '///';
  const chip = el('div', 'logochip'); chip.textContent = '🌾';
  const t = el('div'); t.id = 'navtitle'; t.textContent = '智慧养殖场';
  const line = el('div', 'hline');
  bar.appendChild(s); bar.appendChild(chip); bar.appendChild(t); bar.appendChild(line);
  pages.forEach((p, i) => {
    const b = el('div', 'navbtn'); b.textContent = p.name;
    b.dataset.idx = i + 1;
    b.onclick = () => buildPage(i + 1);
    bar.appendChild(b);
  });
}
function buildPage(idx) {
  document.querySelectorAll('.navbtn').forEach(b =>
    b.classList.toggle('on', +b.dataset.idx === idx));
  document.getElementById('content').innerHTML = '';
  tickers = []; charts = [];
  const def = pages[idx - 1];
  def.panels.forEach((p, i) => {
    const a = drawPanel(cellRect(i + 1), p);
    if (p.kind === 'm') addMetrics(a, p);
    else if (p.kind === 'p') addProgress(a, p);
    else if (p.kind === 'l') addList(a, p);
    else if (p.kind === 'd') addDonut(a, p);
    else if (p.kind === 'r') addRadar(a, p);
    else addChart(a, p);
  });
  tick();
}
function tick() {
  charts.forEach(ch => {
    if (ch.type === 'c') {
      ch.def.series.forEach(s => { s.vals = s.gen(); });
      drawChart(ch.cv, ch.def);
    } else if (ch.type === 'r') {
      ch.def.series.forEach(s => { s.vals = s.gen(); });
      drawRadar(ch.cv, ch.def);
    }
  });
  tickers.forEach(f => f());
}
/* 自适应缩放（保证整屏完整显示，不会被裁切） */
function fit() {
  const stageH = 480 + 28;
  let s = Math.min((window.innerWidth - 14) / 800, (window.innerHeight - 14) / stageH);
  if (s > 1.8) s = 1.8;
  if (s < 0.2) s = 0.2;
  document.getElementById('stage').style.transform = 'scale(' + s + ')';
}
buildNav();
buildPage(1);
setInterval(tick, 1500);
setInterval(fit, 600);
window.addEventListener('resize', fit);
window.addEventListener('load', fit);
fit();
</script>
