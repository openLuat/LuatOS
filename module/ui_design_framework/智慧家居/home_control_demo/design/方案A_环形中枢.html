<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案A · 环形中枢布局 — 1024×600 深色中控</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --s0:#0C0E13; --s1:#151823; --s2:#1C2030; --s3:#242A3C;
  --pri:#4DA3FF; --pri-glow:rgba(77,163,255,.45);
  --ok:#3DDC84; --warn:#F5A623; --danger:#FF5C5C;
  --t1:#EEF1F7; --t2:#9AA1B3; --t3:#6B7284;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --eo:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;user-select:none}
body{background:#000;display:grid;place-items:center;min-height:100vh}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:var(--r-sm)}
.screen{
  width:1024px;height:600px;position:relative;overflow:hidden;
  background:
    radial-gradient(600px 300px at 50% 0%, rgba(77,163,255,.08), transparent 70%),
    var(--s0);
  color:var(--t1);border:6px solid #1A1D26;border-radius:22px;
}
/* ============ 顶栏：状态一排扫读 ============ */
.topbar{
  height:56px;display:flex;align-items:center;gap:var(--g,16px);
  padding:0 24px;border-bottom:1px solid rgba(255,255,255,.06);
}
.brand{font-size:18px;font-weight:700;letter-spacing:2px}
.st-chip{
  display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;
  border-radius:99px;background:var(--s1);font-size:13px;color:var(--t2);
}
.st-chip .dot{width:7px;height:7px;border-radius:50%}
.st-chip.ok .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.st-chip.warn .dot{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.st-chip b{color:var(--t1);font-weight:600}
.topbar .grow{flex:1}
.clock{font-size:15px;color:var(--t2);font-variant-numeric:tabular-nums}
.clock b{color:var(--t1);font-size:18px}
/* ============ 主体：左列(灯光) + 中央环 + 右列(安防/场景) ============ */
.body3{
  position:absolute;left:0;top:56px;right:0;bottom:64px;
  display:grid;grid-template-columns:264px 1fr 264px;gap:16px;padding:16px 24px;
}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.sec-title{font-size:12px;color:var(--t3);letter-spacing:2px;font-weight:700}
/* 灯光平铺行：一眼看到、一步操作 */
.light-row{
  display:flex;align-items:center;gap:10px;min-height:52px;
  background:var(--s1);border-radius:var(--r-md);padding:8px 14px;cursor:pointer;
  border:none;text-align:left;color:var(--t1);width:100%;
  transition:background .15s var(--eo);
}
.light-row:hover{background:var(--s2)}
.light-row:active{transform:scale(.98)}
.light-row .ic{
  width:34px;height:34px;border-radius:9px;background:var(--s3);
  display:grid;place-items:center;color:var(--t3);flex:0 0 34px;
}
.light-row.on .ic{background:rgba(77,163,255,.18);color:var(--pri);box-shadow:0 0 10px var(--pri-glow)}
.light-row .meta{flex:1;min-width:0}
.light-row .nm{font-size:15px;font-weight:500}
.light-row .ds{font-size:12px;color:var(--t2);margin-top:2px}
/* 中央：空调大环 */
.center{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--s1);border-radius:var(--r-lg);position:relative;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}
.center .tag{position:absolute;left:18px;top:16px;font-size:13px;color:var(--t2);font-weight:600}
.center .room-chip{
  position:absolute;right:16px;top:14px;height:30px;padding:0 14px;border-radius:99px;
  background:var(--s3);color:var(--t2);font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;border:none;
}
.dial{
  width:236px;height:236px;border-radius:50%;position:relative;
  background:conic-gradient(from 220deg,var(--pri) calc(var(--pct,50)*0.78*1%),rgba(255,255,255,.06) 0);
  display:grid;place-items:center;
  filter:drop-shadow(0 0 18px var(--pri-glow));
}
.dial-in{
  width:196px;height:196px;border-radius:50%;background:var(--s1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.dial-temp{font-size:56px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.dial-temp small{font-size:22px;color:var(--t2)}
.dial-mode{font-size:14px;color:var(--pri);letter-spacing:1px}
.dial-wind{font-size:12px;color:var(--t3);margin-top:2px}
.ac-ctl{display:flex;gap:20px}
.ac-btn{
  width:46px;height:46px;border-radius:50%;background:var(--s3);border:none;
  color:var(--t1);font-size:22px;cursor:pointer;transition:.15s var(--eo);
}
.ac-btn:hover{background:#2E3550;color:var(--pri)}
.ac-btn:active{transform:scale(.92)}
.ac-btn:disabled{opacity:.3;cursor:not-allowed}
/* 右列：安防 + 场景 */
.sec-item{
  display:flex;align-items:center;gap:10px;min-height:52px;
  background:var(--s1);border-radius:var(--r-md);padding:8px 14px;border:none;width:100%;
  text-align:left;color:var(--t1);cursor:pointer;transition:background .15s var(--eo);
}
.sec-item:hover{background:var(--s2)}
.sec-item .ic{width:34px;height:34px;border-radius:9px;background:var(--s3);display:grid;place-items:center;color:var(--t2);flex:0 0 34px}
.sec-item.armed .ic{color:var(--ok);background:rgba(61,220,132,.14)}
.sec-item .meta{flex:1}
.sec-item .nm{font-size:15px;font-weight:500}
.sec-item .ds{font-size:12px;margin-top:2px;color:var(--t2)}
.sec-item .st{font-size:12px;font-weight:700}
.sec-item.armed .st{color:var(--ok)}
.scene-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene-btn{
  height:56px;border-radius:var(--r-md);border:none;cursor:pointer;
  background:var(--s1);color:var(--t1);font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:.15s var(--eo);
}
.scene-btn:hover{background:var(--s2);color:var(--pri)}
.scene-btn:active{transform:scale(.96)}
.scene-btn.primary{background:rgba(77,163,255,.15);color:var(--pri)}
/* ============ 底部环境条：图表化反馈 ============ */
.envbar{
  position:absolute;left:0;right:0;bottom:0;height:64px;
  display:flex;align-items:center;gap:28px;padding:0 32px;
  background:rgba(21,24,35,.7);border-top:1px solid rgba(255,255,255,.06);
}
.env-cell{display:flex;align-items:center;gap:10px}
.env-cell .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.env-cell .l{font-size:12px;color:var(--t3)}
.env-cell svg{display:block}
/* Toast */
.toast{
  position:absolute;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);
  padding:9px 22px;border-radius:99px;font-size:14px;white-space:nowrap;
  background:rgba(77,163,255,.16);border:1px solid rgba(77,163,255,.4);color:var(--pri);
  opacity:0;pointer-events:none;transition:.2s var(--eo);z-index:30;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 亮度弹窗（比跳转更合理的二级操作） */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;visibility:hidden;transition:.2s var(--eo)}
.mask.show{opacity:1;visibility:visible}
.pop{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);
  width:380px;background:var(--s2);border-radius:var(--r-lg);padding:24px;z-index:21;
  box-shadow:0 16px 50px rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.2s var(--eo);
}
.pop.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.pop h4{font-size:18px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.pop h4 button{width:40px;height:40px;border-radius:50%;border:none;background:var(--s3);color:var(--t2);font-size:20px;cursor:pointer}
.slider{height:28px;display:flex;align-items:center;cursor:pointer;touch-action:none;position:relative}
.slider .track{width:100%;height:12px;border-radius:6px;background:var(--s3);overflow:hidden}
.slider .fill{height:100%;background:linear-gradient(90deg,#2B6CB0,var(--pri));border-radius:6px}
.slider .thumb{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none}
.pop .val{text-align:right;margin-top:8px;font-size:16px;color:var(--t2);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="screen">
  <!-- 顶栏：安防/在线/模式 状态一排扫读 -->
  <div class="topbar">
    <span class="brand">HOME</span>
    <span class="st-chip ok"><span class="dot"></span>安防 <b>在家布防</b></span>
    <span class="st-chip ok"><span class="dot"></span>门锁 <b>已上锁</b></span>
    <span class="st-chip warn"><span class="dot"></span>客厅窗户 <b>未关</b></span>
    <span class="grow"></span>
    <span class="clock"><b id="clk">--:--</b>&nbsp; 11月13日 周五</span>
  </div>

  <div class="body3">
    <!-- 左列：灯光平铺，全一级露出 -->
    <div class="col">
      <div class="sec-title">灯光 · 2/4 开</div>
      <button class="light-row on" data-name="客厅主灯" data-val="60" data-prefix="亮度 ">
        <span class="ic">☀</span>
        <span class="meta"><span class="nm">客厅主灯</span><div class="ds">亮度 60%</div></span>
      </button>
      <button class="light-row on" data-name="客厅筒灯" data-val="80" data-prefix="亮度 ">
        <span class="ic">◍</span>
        <span class="meta"><span class="nm">客厅筒灯</span><div class="ds">亮度 80%</div></span>
      </button>
      <button class="light-row" data-name="灯带" data-val="70" data-prefix="亮度 ">
        <span class="ic">≡</span>
        <span class="meta"><span class="nm">灯带</span><div class="ds">关闭</div></span>
      </button>
      <button class="light-row" data-name="氛围灯" data-val="35" data-prefix="色温 ">
        <span class="ic">✦</span>
        <span class="meta"><span class="nm">氛围灯</span><div class="ds">关闭</div></span>
      </button>
      <div class="sec-title" style="margin-top:4px">窗帘</div>
      <button class="light-row" data-name="客厅窗帘" data-val="30" data-prefix="开合 ">
        <span class="ic">▤</span>
        <span class="meta"><span class="nm">客厅窗帘</span><div class="ds">开合 30%</div></span>
      </button>
    </div>

    <!-- 中央：空调环（核心功能大卡扁平露出） -->
    <div class="center">
      <span class="tag">空调</span>
      <button class="room-chip" id="roomChip">客厅 ▾</button>
      <div class="dial" id="dial">
        <div class="dial-in">
          <div class="dial-temp"><span id="acT">26</span><small>℃</small></div>
          <div class="dial-mode">制冷</div>
          <div class="dial-wind">风速 · 自动</div>
        </div>
      </div>
      <div class="ac-ctl">
        <button class="ac-btn" id="acM" aria-label="降低温度">−</button>
        <button class="ac-btn" id="acP" aria-label="升高温度">+</button>
      </div>
    </div>

    <!-- 右列：安防 + 场景 -->
    <div class="col">
      <div class="sec-title">安防</div>
      <button class="sec-item armed" id="armBtn">
        <span class="ic">⛨</span>
        <span class="meta"><div class="nm">布防模式</div><div class="ds">摄像头 3 · 传感器 8</div></span>
        <span class="st">已布防</span>
      </button>
      <button class="sec-item">
        <span class="ic">🔑</span>
        <span class="meta"><div class="nm">门锁</div><div class="ds">今天 09:12 指纹开门</div></span>
        <span class="st" style="color:var(--ok)">已锁</span>
      </button>
      <div class="sec-title" style="margin-top:4px">场景</div>
      <div class="scene-btns">
        <button class="scene-btn primary">回家</button>
        <button class="scene-btn">离家</button>
        <button class="scene-btn">睡眠</button>
        <button class="scene-btn">观影</button>
      </div>
    </div>
  </div>

  <!-- 底部环境条：迷你图表直观反馈 -->
  <div class="envbar">
    <div class="env-cell">
      <svg width="120" height="30" id="sparkT"></svg>
      <div><div class="v">24.0℃</div><div class="l">温度 · 1h 趋势</div></div>
    </div>
    <div class="env-cell">
      <svg width="120" height="30" id="sparkH"></svg>
      <div><div class="v">48%</div><div class="l">湿度</div></div>
    </div>
    <div class="env-cell">
      <svg width="120" height="30" id="sparkC"></svg>
      <div><div class="v">480</div><div class="l">CO₂ ppm</div></div>
    </div>
    <div class="grow" style="flex:1"></div>
    <div class="env-cell"><div><div class="v" style="color:var(--ok)">优</div><div class="l">空气质量</div></div></div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="mask" id="mask"></div>
  <div class="pop" id="pop">
    <h4><span id="popT">客厅主灯</span><button id="popX">×</button></h4>
    <div class="slider" id="sl"><div class="track"><div class="fill" id="fill"></div></div><div class="thumb" id="thumb"></div></div>
    <div class="val" id="val">60%</div>
  </div>
</div>

<script>
var toastTimer=null;
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.classList.remove('show')},2000)}

// 时钟
function clk(){var d=new Date();function p(n){return String(n).padStart(2,'0')}
  document.getElementById('clk').textContent=p(d.getHours())+':'+p(d.getMinutes())}
clk();setInterval(clk,1000);

// 灯光行：单击切换开关，长按/再次进入弹窗调亮度
// 设计：单击=开关（一步操作），行内已显示状态；调亮度走弹窗
var current=null;
document.querySelectorAll('.light-row').forEach(function(row){
  var name=row.dataset.name,prefix=row.dataset.prefix||'亮度 ',ds=row.querySelector('.ds');
  row.onclick=function(e){
    if(row.classList.contains('pressing'))return;
    var on=row.classList.toggle('on');
    ds.textContent=on?(prefix+(row.dataset.val)+'%'):'关闭';
    if(name==='氛围灯'&&on)ds.textContent='色温3500K';
    toast(name+(on?' 已打开':' 已关闭'));
    // 打开弹窗调细节
    setTimeout(function(){openPop(row)},0);
  };
});
function openPop(row){
  current=row;
  document.getElementById('popT').textContent=row.dataset.name;
  var v=Number(row.dataset.val)||50;setPop(v);
  document.getElementById('mask').classList.add('show');
  document.getElementById('pop').classList.add('show');
}
function closePop(){document.getElementById('mask').classList.remove('show');document.getElementById('pop').classList.remove('show');current=null}
document.getElementById('popX').onclick=closePop;
document.getElementById('mask').onclick=closePop;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePop()});
function setPop(v){v=Math.max(0,Math.min(100,v));
  document.getElementById('fill').style.width=v+'%';
  document.getElementById('thumb').style.left=v+'%';
  document.getElementById('val').textContent=v+'%';
  if(current){current.dataset.val=v;
    var ds=current.querySelector('.ds');
    if(current.dataset.name==='氛围灯')ds.textContent='色温'+(v*100+2000)+'K';
    else ds.textContent=(current.dataset.prefix||'亮度 ')+v+'%';}
}
var sl=document.getElementById('sl');
sl.addEventListener('pointerdown',function(e){
  sl.setPointerCapture(e.pointerId);
  function mv(ev){var r=sl.getBoundingClientRect();setPop(Math.round((ev.clientX-r.left)/r.width*100))}
  mv(e);
  function up(){sl.removeEventListener('pointermove',mv);sl.removeEventListener('pointerup',up)}
  sl.addEventListener('pointermove',mv);sl.addEventListener('pointerup',up);
});

// 空调环：16~30 边界 + 环形渐变联动
var AC_MIN=16,AC_MAX=30,ac=26;
var dial=document.getElementById('dial'),acT=document.getElementById('acT'),
    acM=document.getElementById('acM'),acP=document.getElementById('acP');
function renderAc(){
  acT.textContent=ac;
  dial.style.setProperty('--pct',Math.round((ac-AC_MIN)/(AC_MAX-AC_MIN)*100));
  acM.disabled=ac<=AC_MIN;acP.disabled=ac>=AC_MAX;
}
acP.onclick=function(){if(ac<AC_MAX){ac++;renderAc()}};
acM.onclick=function(){if(ac>AC_MIN){ac--;renderAc()}};
renderAc();

// 房间切换（中央环顶部 chip：空调跟随房间）
var roomNames=['客厅','主卧','书房'],ri=0;
document.getElementById('roomChip').onclick=function(){
  ri=(ri+1)%roomNames.length;this.textContent=roomNames[ri]+' ▾';toast('空调已切换到'+roomNames[ri]);
};

// 安防布防切换
document.getElementById('armBtn').onclick=function(){
  var armed=this.classList.toggle('armed');
  this.querySelector('.st').textContent=armed?'已布防':'撤防';
  toast(armed?'安防已布防':'安防已撤防');
};

// 场景
document.querySelectorAll('.scene-btn').forEach(function(b){
  b.onclick=function(){toast('执行场景：'+b.textContent)}
});

// 迷你趋势图（SVG 折线，直观图表反馈）
function spark(id,data,color){
  var svg=document.getElementById(id),w=120,h=30;
  var min=Math.min.apply(null,data),max=Math.max.apply(null,data),rng=max-min||1;
  var pts=data.map(function(v,i){
    return (i/(data.length-1)*w).toFixed(1)+','+((1-(v-min)/rng)*(h-6)+3).toFixed(1);
  }).join(' ');
  svg.innerHTML='<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" '+
    'stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>';
}
spark('sparkT',[23.2,23.5,23.4,23.8,24.1,23.9,24.0,24.2],'#4DA3FF');
spark('sparkH',[52,50,49,51,48,47,48,48],'#3DDC84');
spark('sparkC',[520,500,495,480,470,475,480,480],'#F5A623');
</script>
</body>
</html>
