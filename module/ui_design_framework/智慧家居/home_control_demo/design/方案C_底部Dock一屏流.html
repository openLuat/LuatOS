<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案C · 底部 Dock 一屏流 — 1024×600 深色中控</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --s0:#0D0F14; --s1:#171B26; --s2:#202636; --s3:#2A3149;
  --pri:#F59E0B; --pri-deep:#D97706; --pri-glow:rgba(245,158,11,.4);
  --ok:#3DDC84; --danger:#FF5C5C; --cool:#60A5FA;
  --t1:#F0F2F7; --t2:#9AA2B5; --t3:#69718A;
  --r-lg:18px; --r-md:12px;
  --eo:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;user-select:none}
body{background:#000;display:grid;place-items:center;min-height:100vh}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:var(--r-md)}
.screen{
  width:1024px;height:600px;position:relative;overflow:hidden;color:var(--t1);
  background:var(--s0);border:6px solid #1B1E28;border-radius:22px;
  display:flex;flex-direction:column;
}
/* ============ 上部：房间切换 + 高密度仪表区 ============ */
.main{flex:1;display:flex;flex-direction:column;padding:16px 20px 0;min-height:0}
.room-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.room-bar h2{font-size:22px;font-weight:700;margin-right:8px}
.rtab{
  height:36px;padding:0 18px;border-radius:99px;border:none;cursor:pointer;
  background:var(--s1);color:var(--t2);font-size:14px;transition:.15s var(--eo);
}
.rtab:hover{color:var(--t1)}
.rtab.active{background:var(--pri-deep);color:#fff;font-weight:600}
.rtab.active:active{transform:scale(.96)}
.dash{
  flex:1;display:grid;grid-template-columns:300px 1fr 268px;gap:14px;min-height:0;
  padding-bottom:16px;
}
.panel{background:var(--s1);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;min-height:0;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.panel h6{font-size:12px;color:var(--t3);letter-spacing:2px;font-weight:700;margin-bottom:10px}
/* 左：气候（大数字 + 曲线图） */
.p-climate{align-items:flex-start}
.big-t{font-size:64px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.big-t small{font-size:24px;color:var(--t2)}
.climate-sub{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--t2)}
.climate-sub b{color:var(--t1);font-variant-numeric:tabular-nums}
.chart{margin-top:auto;width:100%}
.chart .bar-row{display:flex;align-items:flex-end;gap:6px;height:74px;margin-top:12px}
.chart .bar{flex:1;border-radius:4px 4px 0 0;background:var(--s3);position:relative;min-height:6px}
.chart .bar.now{background:linear-gradient(180deg,var(--pri),var(--pri-deep));box-shadow:0 0 10px var(--pri-glow)}
.chart .bar span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--t3)}
.chart .xlab{display:flex;gap:6px;margin-top:22px}
.chart .xlab span{flex:1;text-align:center;font-size:10px;color:var(--t3)}
/* 中：设备矩阵（灯光/窗帘 一眼看到一步操作） */
.p-dev{overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
.p-dev::-webkit-scrollbar{display:none}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.dev{
  display:flex;align-items:center;gap:10px;background:var(--s2);border:none;
  border-radius:var(--r-md);padding:10px 12px;cursor:pointer;text-align:left;
  color:var(--t1);min-height:52px;transition:background .15s var(--eo);
}
.dev:hover{background:var(--s3)}
.dev:active{transform:scale(.97)}
.dev .ic{
  width:32px;height:32px;border-radius:9px;background:var(--s3);flex:0 0 32px;
  display:grid;place-items:center;color:var(--t3);font-size:15px;
}
.dev.on .ic{background:rgba(245,158,11,.16);color:var(--pri);box-shadow:0 0 10px var(--pri-glow)}
.dev .meta{flex:1;min-width:0}
.dev .nm{font-size:14px;font-weight:500;white-space:nowrap}
.dev .ds{font-size:11px;color:var(--t2);margin-top:2px;font-variant-numeric:tabular-nums}
/* 右：安防列 */
.p-sec .row{
  display:flex;align-items:center;gap:10px;background:var(--s2);border:none;width:100%;
  border-radius:var(--r-md);padding:10px 14px;min-height:52px;cursor:pointer;
  color:var(--t1);text-align:left;transition:background .15s var(--eo);
}
.p-sec .row:hover{background:var(--s3)}
.p-sec .row + .row{margin-top:8px}
.p-sec .ic{width:32px;height:32px;border-radius:9px;background:var(--s3);display:grid;place-items:center;color:var(--t2);flex:0 0 32px}
.p-sec .ok .ic{color:var(--ok);background:rgba(61,220,132,.14)}
.p-sec .meta{flex:1;min-width:0}
.p-sec .nm{font-size:14px;font-weight:500}
.p-sec .ds{font-size:11px;color:var(--t2);margin-top:2px}
.p-sec .st{font-size:12px;font-weight:700;color:var(--ok)}
.p-sec .st.off{color:var(--t3)}
.cam-thumb{
  margin-top:auto;height:86px;border-radius:var(--r-md);position:relative;overflow:hidden;
  background:linear-gradient(140deg,#1B2138,#141926);cursor:pointer;border:none;width:100%;
}
.cam-thumb::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.02) 3px 4px)}
.cam-thumb .lb{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--t2)}
.cam-thumb .rec{position:absolute;right:10px;top:8px;font-size:10px;color:var(--danger);display:flex;align-items:center;gap:5px;font-weight:700}
.cam-thumb .rec::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--danger);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
/* ============ 底部 Dock：场景一步直达 ============ */
.dock{
  flex:0 0 92px;display:flex;align-items:center;gap:12px;padding:0 20px;
  background:rgba(23,27,38,.85);border-top:1px solid rgba(255,255,255,.06);
}
.dock-btn{
  flex:1;height:60px;border-radius:var(--r-md);border:none;cursor:pointer;
  background:var(--s2);color:var(--t1);display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:15px;font-weight:600;transition:.15s var(--eo);
}
.dock-btn .i{width:30px;height:30px;border-radius:9px;background:var(--s3);display:grid;place-items:center;font-size:15px;color:var(--t2)}
.dock-btn:hover{background:var(--s3)}
.dock-btn:hover .i{color:var(--pri);background:rgba(245,158,11,.15)}
.dock-btn:active{transform:scale(.96)}
.dock-btn.home{background:rgba(245,158,11,.15);color:var(--pri)}
.dock-btn.home .i{background:transparent;color:var(--pri)}
/* Toast */
.toast{
  position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(8px);
  padding:9px 22px;border-radius:99px;font-size:14px;white-space:nowrap;z-index:30;
  background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.45);color:var(--pri);
  opacity:0;pointer-events:none;transition:.2s var(--eo);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 弹窗 */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;visibility:hidden;transition:.2s var(--eo)}
.mask.show{opacity:1;visibility:visible}
.pop{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);
  width:380px;background:var(--s2);border-radius:var(--r-lg);padding:24px;z-index:21;
  box-shadow:0 16px 50px rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.2s var(--eo);
}
.pop.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.pop h4{font-size:18px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.pop h4 button{width:40px;height:40px;border-radius:50%;border:none;background:var(--s3);color:var(--t2);font-size:20px;cursor:pointer}
.slider{height:28px;display:flex;align-items:center;cursor:pointer;touch-action:none;position:relative}
.slider .track{width:100%;height:12px;border-radius:6px;background:var(--s3);overflow:hidden}
.slider .fill{height:100%;background:linear-gradient(90deg,var(--pri-deep),var(--pri));border-radius:6px}
.slider .thumb{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none}
.pop .val{text-align:right;margin-top:8px;font-size:16px;color:var(--t2);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="screen">
  <div class="main">
    <!-- 房间切换：一级内容跟随切换，无页面跳转 -->
    <div class="room-bar">
      <h2 id="roomName">客厅</h2>
      <button class="rtab active">客厅</button>
      <button class="rtab">主卧</button>
      <button class="rtab">书房</button>
      <button class="rtab">厨房</button>
    </div>

    <div class="dash">
      <!-- 左：气候面板（大数字 + 24h 柱状温度图） -->
      <div class="panel p-climate">
        <h6>气候</h6>
        <div class="big-t">24.0<small>℃</small></div>
        <div class="climate-sub">
          <span>湿度 <b>48%</b></span>
          <span>空调 <b style="color:var(--cool)">26℃ 制冷</b></span>
        </div>
        <div class="chart">
          <div class="bar-row">
            <div class="bar" style="height:42%"></div>
            <div class="bar" style="height:38%"></div>
            <div class="bar" style="height:46%"></div>
            <div class="bar" style="height:55%"></div>
            <div class="bar" style="height:68%"></div>
            <div class="bar now" style="height:80%"></div>
            <div class="bar" style="height:74%;opacity:.45"></div>
            <div class="bar" style="height:60%;opacity:.45"></div>
          </div>
          <div class="xlab"><span>08时</span><span>12时</span><span>16时</span><span>20时</span></div>
        </div>
      </div>

      <!-- 中：设备矩阵（直开，单击切换） -->
      <div class="panel p-dev">
        <h6>设备 · 3/6 开</h6>
        <div class="dev-grid">
          <button class="dev on" data-name="客厅主灯" data-val="60"><span class="ic">☀</span><span class="meta"><div class="nm">客厅主灯</div><div class="ds">亮度 60%</div></span></button>
          <button class="dev on" data-name="客厅筒灯" data-val="80"><span class="ic">◍</span><span class="meta"><div class="nm">客厅筒灯</div><div class="ds">亮度 80%</div></span></button>
          <button class="dev" data-name="灯带" data-val="70"><span class="ic">≡</span><span class="meta"><div class="nm">灯带</div><div class="ds">关闭</div></span></button>
          <button class="dev" data-name="客厅窗帘" data-val="30"><span class="ic">▤</span><span class="meta"><div class="nm">客厅窗帘</div><div class="ds">开合 30%</div></span></button>
          <button class="dev on" data-name="新风" data-val="45"><span class="ic">❋</span><span class="meta"><div class="nm">新风</div><div class="ds">风量 45%</div></span></button>
          <button class="dev" data-name="加湿器" data-val="50"><span class="ic">≋</span><span class="meta"><div class="nm">加湿器</div><div class="ds">关闭</div></span></button>
        </div>
      </div>

      <!-- 右：安防 + 摄像头直出 -->
      <div class="panel p-sec">
        <h6>安防</h6>
        <button class="row ok" id="armBtn"><span class="ic">⛨</span><span class="meta"><div class="nm">布防模式</div><div class="ds">8 传感器 · 3 摄像头</div></span><span class="st">在家布防</span></button>
        <button class="row ok" id="lockBtn"><span class="ic">🔑</span><span class="meta"><div class="nm">门锁</div><div class="ds">09:12 指纹开门</div></span><span class="st">已上锁</span></button>
        <button class="cam-thumb" id="camBtn">
          <span class="rec">LIVE</span>
          <span class="lb">门口摄像头 · 1080P</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 底部 Dock：场景直达，不进二级 -->
  <div class="dock">
    <button class="dock-btn home"><span class="i">⌂</span>回家</button>
    <button class="dock-btn"><span class="i">⇥</span>离家</button>
    <button class="dock-btn"><span class="i">☾</span>睡眠</button>
    <button class="dock-btn"><span class="i">▶</span>观影</button>
    <button class="dock-btn"><span class="i">☀</span>起床</button>
    <button class="dock-btn"><span class="i">✦</span>会客</button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="mask" id="mask"></div>
  <div class="pop" id="pop">
    <h4><span id="popT">客厅主灯</span><button id="popX">×</button></h4>
    <div class="slider" id="sl"><div class="track"><div class="fill" id="fill"></div></div><div class="thumb" id="thumb"></div></div>
    <div class="val" id="val">60%</div>
  </div>
</div>

<script>
var toastTimer=null;
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.classList.remove('show')},2000)}

// 房间切换：内容跟随（演示数据切换）
var ROOMS={
  '客厅':{t:'24.0',h:48,ac:'26℃ 制冷',devs:[
    {nm:'客厅主灯',ic:'☀',on:1,val:60,ds:'亮度 '},
    {nm:'客厅筒灯',ic:'◍',on:1,val:80,ds:'亮度 '},
    {nm:'灯带',ic:'≡',on:0,val:70,ds:'亮度 '},
    {nm:'客厅窗帘',ic:'▤',on:0,val:30,ds:'开合 '},
    {nm:'新风',ic:'❋',on:1,val:45,ds:'风量 '},
    {nm:'加湿器',ic:'≋',on:0,val:50,ds:'雾量 '}]},
  '主卧':{t:'25.1',h:55,ac:'25℃ 制冷',devs:[
    {nm:'主卧吸顶灯',ic:'☀',on:0,val:70,ds:'亮度 '},
    {nm:'床头灯',ic:'✦',on:1,val:30,ds:'亮度 '},
    {nm:'主卧窗帘',ic:'▤',on:1,val:100,ds:'开合 '},
    {nm:'加湿器',ic:'≋',on:0,val:50,ds:'雾量 '},
    {nm:'新风',ic:'❋',on:1,val:40,ds:'风量 '},
    {nm:'电热毯',ic:'♨',on:0,val:60,ds:'档位 '}]},
  '书房':{t:'23.4',h:44,ac:'关闭',devs:[
    {nm:'书房台灯',ic:'✦',on:1,val:80,ds:'亮度 '},
    {nm:'书房主灯',ic:'☀',on:0,val:60,ds:'亮度 '},
    {nm:'书房窗帘',ic:'▤',on:0,val:0,ds:'开合 '},
    {nm:'新风',ic:'❋',on:0,val:40,ds:'风量 '}]},
  '厨房':{t:'26.2',h:62,ac:'关闭',devs:[
    {nm:'厨房顶灯',ic:'☀',on:1,val:90,ds:'亮度 '},
    {nm:'油烟机',ic:'❋',on:0,val:70,ds:'档位 '},
    {nm:'净水器',ic:'≋',on:1,val:50,ds:'流量 '}]},
};
var devGrid=document.querySelector('.dev-grid');
document.querySelectorAll('.rtab').forEach(function(tab){
  tab.onclick=function(){
    document.querySelectorAll('.rtab').forEach(function(t){t.classList.remove('active')});
    tab.classList.add('active');
    var name=tab.textContent,room=ROOMS[name];
    document.getElementById('roomName').textContent=name;
    // 重绘设备矩阵
    devGrid.innerHTML=room.devs.map(function(d,i){
      return '<button class="dev'+(d.on?' on':'')+'" data-name="'+d.nm+'" data-val="'+d.val+'" data-ds="'+d.ds+'">'+
        '<span class="ic">'+d.ic+'</span><span class="meta"><div class="nm">'+d.nm+'</div>'+
        '<div class="ds">'+(d.on?d.ds+d.val+'%':'关闭')+'</div></span></button>';
    }).join('');
    bindDevs();
    toast('已切换到 '+name);
  };
});

// 设备：单击切换，再次长按弹窗调档
function bindDevs(){
  devGrid.querySelectorAll('.dev').forEach(function(it){
    var pressTimer=null;
    it.addEventListener('pointerdown',function(){pressTimer=setTimeout(function(){openPop(it);it._long=true},500)});
    it.addEventListener('pointerup',function(){
      clearTimeout(pressTimer);
      if(it._long){it._long=false;return}
      var on=it.classList.toggle('on'),ds=it.querySelector('.ds');
      ds.textContent=on?(it.dataset.ds+it.dataset.val+'%'):'关闭';
      toast(it.dataset.name+(on?' 已打开':' 已关闭'));
    });
  });
}
bindDevs();

// 弹窗滑条
function openPop(it){
  current=it;
  document.getElementById('popT').textContent=it.dataset.name;
  setPop(Number(it.dataset.val)||50);
  document.getElementById('mask').classList.add('show');
  document.getElementById('pop').classList.add('show');
}
function closePop(){document.getElementById('mask').classList.remove('show');document.getElementById('pop').classList.remove('show');current=null}
document.getElementById('popX').onclick=closePop;
document.getElementById('mask').onclick=closePop;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePop()});
function setPop(v){v=Math.max(0,Math.min(100,v));
  document.getElementById('fill').style.width=v+'%';
  document.getElementById('thumb').style.left=v+'%';
  document.getElementById('val').textContent=v+'%';
  if(current){current.dataset.val=v;
    var ds=current.querySelector('.ds');
    if(ds&&current.classList.contains('on'))ds.textContent=current.dataset.ds+v+'%';}
}
var sl=document.getElementById('sl');
sl.addEventListener('pointerdown',function(e){
  sl.setPointerCapture(e.pointerId);
  function mv(ev){var r=sl.getBoundingClientRect();setPop(Math.round((ev.clientX-r.left)/r.width*100))}
  mv(e);
  function up(){sl.removeEventListener('pointermove',mv);sl.removeEventListener('pointerup',up)}
  sl.addEventListener('pointermove',mv);sl.addEventListener('pointerup',up);
});

// 安防
document.getElementById('armBtn').onclick=function(){
  var ok=this.classList.toggle('ok'),st=this.querySelector('.st');
  st.textContent=ok?'在家布防':'已撤防';st.classList.toggle('off',!ok);
  toast(ok?'安防已布防':'安防已撤防');
};
document.getElementById('lockBtn').onclick=function(){
  var ok=this.classList.toggle('ok'),st=this.querySelector('.st');
  st.textContent=ok?'已上锁':'已开锁';st.classList.toggle('off',!ok);
  toast(ok?'门锁已上锁':'门锁已开锁');
};
document.getElementById('camBtn').onclick=function(){toast('打开门口摄像头全屏画面')};

// 场景 Dock
document.querySelectorAll('.dock-btn').forEach(function(b){
  b.onclick=function(){toast('执行场景：'+b.textContent.trim())};
});
</script>
</body>
</html>
