<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案D · 玻璃拟态（Apple 风格）— 1024×600 中控</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  /* 玻璃分层：亮度和透明度造层级 */
  --glass-1:rgba(255,255,255,.10);   /* 页面级玻璃 */
  --glass-2:rgba(255,255,255,.16);   /* 卡片 */
  --glass-3:rgba(255,255,255,.24);   /* 浮起元素/弹窗 */
  --stroke:rgba(255,255,255,.18);
  --stroke-hi:rgba(255,255,255,.35);
  --t1:#FFFFFF; --t2:rgba(255,255,255,.68); --t3:rgba(255,255,255,.45);
  --pri:#7DD3FC;                     /* 天蓝高亮 */
  --ok:#4ADE80; --warn:#FBBF24; --danger:#FB7185;
  --r-lg:26px; --r-md:16px;
  --eo:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;user-select:none}
body{background:#000;display:grid;place-items:center;min-height:100vh}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:var(--r-md)}
.screen{
  width:1024px;height:600px;position:relative;overflow:hidden;color:var(--t1);
  border:6px solid #15171F;border-radius:24px;
  /* 深空底 + 彩色氛围光斑（玻璃卡片的"透出物"） */
  background:
    radial-gradient(420px 300px at 8% 8%, rgba(124,58,237,.38), transparent 70%),
    radial-gradient(460px 320px at 92% 16%, rgba(14,165,233,.34), transparent 70%),
    radial-gradient(500px 340px at 78% 95%, rgba(236,72,153,.26), transparent 70%),
    radial-gradient(380px 280px at 20% 92%, rgba(45,212,191,.22), transparent 70%),
    linear-gradient(160deg,#191B26 0%,#14161E 55%,#101219 100%);
}
/* 通用玻璃卡片 */
.glass{
  background:var(--glass-2);
  backdrop-filter:blur(24px) saturate(1.4);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  border:1px solid var(--stroke);
  border-radius:var(--r-lg);
  box-shadow:0 10px 34px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.14);
}
/* ============ 顶栏：玻璃悬浮胶囊 ============ */
.top{
  position:absolute;left:20px;right:20px;top:18px;height:56px;z-index:5;
  display:flex;align-items:center;gap:14px;padding:0 20px;
}
.top .brand{font-size:17px;font-weight:700;letter-spacing:.5px}
.top .grow{flex:1}
.chip{
  height:34px;padding:0 15px;border-radius:99px;font-size:13px;
  background:rgba(255,255,255,.10);border:1px solid var(--stroke);
  display:flex;align-items:center;gap:7px;color:var(--t2);cursor:pointer;
  transition:.15s var(--eo);border-width:1px;border-style:solid;
}
.chip:hover{background:rgba(255,255,255,.18);color:var(--t1)}
.chip:active{transform:scale(.96)}
.chip .d{width:7px;height:7px;border-radius:50%}
.chip.ok .d{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.chip.warn .d{background:var(--warn);box-shadow:0 0 7px var(--warn)}
.chip b{color:var(--t1);font-weight:600}
.clock{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.clock small{font-size:12px;font-weight:400;color:var(--t2);margin-left:8px}
/* ============ 主体三栏 ============ */
.wrap{
  position:absolute;left:20px;right:20px;top:88px;bottom:20px;
  display:grid;grid-template-columns:290px 1fr 290px;gap:16px;min-height:0;
}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
.g-title{
  font-size:13px;font-weight:600;color:var(--t2);letter-spacing:1px;
  display:flex;align-items:center;justify-content:space-between;
}
.g-title .more{font-size:12px;color:var(--t3);cursor:pointer;border:none;background:none}
.g-title .more:hover{color:var(--pri)}
/* 玻璃行（灯光/安防） */
.grow-item{
  display:flex;align-items:center;gap:12px;min-height:56px;
  padding:8px 16px;border:none;border-radius:var(--r-md);cursor:pointer;
  background:var(--glass-1);border:1px solid var(--stroke);text-align:left;color:var(--t1);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:background .15s var(--eo),border-color .15s var(--eo);
  width:100%;
}
.grow-item:hover{background:var(--glass-2);border-color:var(--stroke-hi)}
.grow-item:active{transform:scale(.98)}
.grow-item .ic{
  width:36px;height:36px;border-radius:11px;flex:0 0 36px;
  background:rgba(255,255,255,.10);display:grid;place-items:center;font-size:16px;color:var(--t2);
  border:1px solid var(--stroke);
}
.grow-item.on .ic{
  background:linear-gradient(135deg,rgba(125,211,252,.3),rgba(125,211,252,.12));
  color:var(--pri);box-shadow:0 0 14px rgba(125,211,252,.35);
}
.grow-item .meta{flex:1;min-width:0}
.grow-item .nm{font-size:15px;font-weight:600}
.grow-item .ds{font-size:12px;color:var(--t2);margin-top:2px;font-variant-numeric:tabular-nums}
/* 中央：空调玻璃环 */
.center{padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative}
.center .room{
  position:absolute;left:20px;top:18px;height:34px;padding:0 16px;border-radius:99px;
  background:rgba(255,255,255,.12);border:1px solid var(--stroke);color:var(--t1);
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.15s var(--eo);
}
.center .room:hover{background:rgba(255,255,255,.2)}
.center .mode-chip{
  position:absolute;right:20px;top:18px;height:34px;padding:0 16px;border-radius:99px;
  background:rgba(125,211,252,.16);border:1px solid rgba(125,211,252,.35);
  color:var(--pri);font-size:13px;font-weight:600;display:flex;align-items:center;cursor:pointer;
}
.dial{
  width:230px;height:230px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from 220deg,var(--pri) calc(var(--pct,50)*.78*1%),rgba(255,255,255,.08) 0);
  box-shadow:0 0 34px rgba(125,211,252,.35), inset 0 1px 0 rgba(255,255,255,.2);
}
.dial-in{
  width:190px;height:190px;border-radius:50%;
  background:rgba(20,24,36,.55);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--stroke);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.dial-t{font-size:58px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.dial-t small{font-size:22px;color:var(--t2)}
.dial-m{font-size:13px;color:var(--t2);margin-top:6px}
.ac-row{display:flex;gap:22px}
.ac-b{
  width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:22px;
  background:rgba(255,255,255,.12);border:1px solid var(--stroke);color:var(--t1);
  transition:.15s var(--eo);
}
.ac-b:hover{background:rgba(255,255,255,.2)}
.ac-b:active{transform:scale(.92)}
.ac-b:disabled{opacity:.3;cursor:not-allowed}
/* 场景玻璃块 */
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc{
  height:62px;border-radius:var(--r-md);cursor:pointer;font-size:15px;font-weight:600;
  background:var(--glass-1);border:1px solid var(--stroke);color:var(--t1);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s var(--eo);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.sc:hover{background:var(--glass-3);border-color:var(--stroke-hi)}
.sc:active{transform:scale(.96)}
.sc.primary{
  background:linear-gradient(135deg,rgba(125,211,252,.32),rgba(125,211,252,.14));
  border-color:rgba(125,211,252,.45);color:#fff;
}
/* 底部环境玻璃条 */
.envbar{
  margin-top:auto;padding:12px 18px;display:flex;align-items:center;gap:18px;
}
.env-cell{display:flex;align-items:center;gap:10px;flex:1}
.env-cell .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.env-cell .l{font-size:11px;color:var(--t3)}
.env-cell svg{flex-shrink:0}
/* Toast */
.toast{
  position:absolute;left:50%;bottom:34px;transform:translateX(-50%) translateY(8px);
  padding:10px 24px;border-radius:99px;font-size:14px;white-space:nowrap;z-index:40;
  background:rgba(30,34,48,.75);border:1px solid var(--stroke-hi);color:var(--t1);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  opacity:0;pointer-events:none;transition:.2s var(--eo);
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 弹窗：毛玻璃悬浮层 */
.mask{position:absolute;inset:0;background:rgba(10,12,18,.4);backdrop-filter:blur(4px);z-index:20;opacity:0;visibility:hidden;transition:.2s var(--eo)}
.mask.show{opacity:1;visibility:visible}
.pop{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);
  width:390px;padding:26px;z-index:21;opacity:0;visibility:hidden;transition:.2s var(--eo);
}
.pop.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.pop h4{font-size:19px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.pop h4 button{
  width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:20px;color:var(--t2);
  background:rgba(255,255,255,.1);border:1px solid var(--stroke);transition:.15s var(--eo);
}
.pop h4 button:hover{background:rgba(255,255,255,.2);color:var(--t1)}
.slider{height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none;position:relative}
.slider .track{width:100%;height:14px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid var(--stroke)}
.slider .fill{height:100%;background:linear-gradient(90deg,rgba(125,211,252,.5),var(--pri));border-radius:7px}
.slider .thumb{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pop .val{text-align:right;margin-top:10px;font-size:17px;color:var(--t2);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="screen">
  <!-- 顶栏玻璃胶囊 -->
  <div class="top glass">
    <span class="brand">Home</span>
    <button class="chip ok" id="armChip"><span class="d"></span>安防 <b>在家布防</b></button>
    <button class="chip ok" id="lockChip"><span class="d"></span>门锁 <b>已上锁</b></button>
    <button class="chip warn"><span class="d"></span>窗户 <b>1 处未关</b></button>
    <span class="grow"></span>
    <span class="clock"><span id="clk">--:--</span><small>11月13日 周五</small></span>
  </div>

  <div class="wrap">
    <!-- 左列：灯光玻璃行 -->
    <div class="col">
      <div class="g-title">灯光 <button class="more">全部关闭</button></div>
      <button class="grow-item on" data-name="客厅主灯" data-val="60" data-ds="亮度 ">
        <span class="ic">☀</span>
        <span class="meta"><div class="nm">客厅主灯</div><div class="ds">亮度 60%</div></span>
      </button>
      <button class="grow-item on" data-name="客厅筒灯" data-val="80" data-ds="亮度 ">
        <span class="ic">◍</span>
        <span class="meta"><div class="nm">客厅筒灯</div><div class="ds">亮度 80%</div></span>
      </button>
      <button class="grow-item" data-name="灯带" data-val="70" data-ds="亮度 ">
        <span class="ic">≡</span>
        <span class="meta"><div class="nm">灯带</div><div class="ds">关闭</div></span>
      </button>
      <button class="grow-item" data-name="氛围灯" data-val="35" data-ds="色温">
        <span class="ic">✦</span>
        <span class="meta"><div class="nm">氛围灯</div><div class="ds">关闭</div></span>
      </button>
      <button class="grow-item" data-name="客厅窗帘" data-val="30" data-ds="开合 ">
        <span class="ic">▤</span>
        <span class="meta"><div class="nm">客厅窗帘</div><div class="ds">开合 30%</div></span>
      </button>

      <!-- 底部环境玻璃条（左列底部） -->
      <div class="envbar glass">
        <div class="env-cell">
          <div><div class="v">24.0℃</div><div class="l">温度</div></div>
          <svg width="56" height="24" id="sp1"></svg>
        </div>
        <div class="env-cell">
          <div><div class="v">48%</div><div class="l">湿度</div></div>
          <svg width="56" height="24" id="sp2"></svg>
        </div>
        <div class="env-cell">
          <div><div class="v">480</div><div class="l">CO₂</div></div>
          <svg width="56" height="24" id="sp3"></svg>
        </div>
      </div>
    </div>

    <!-- 中央：空调玻璃环 -->
    <div class="center glass">
      <button class="room" id="roomBtn">客厅 ▾</button>
      <button class="mode-chip">制冷</button>
      <div class="dial" id="dial">
        <div class="dial-in">
          <div class="dial-t"><span id="acT">26</span><small>℃</small></div>
          <div class="dial-m">风速 · 自动</div>
        </div>
      </div>
      <div class="ac-row">
        <button class="ac-b" id="acM" aria-label="降低温度">−</button>
        <button class="ac-b" id="acP" aria-label="升高温度">+</button>
      </div>
    </div>

    <!-- 右列：安防 + 场景 -->
    <div class="col">
      <div class="g-title">安防</div>
      <button class="grow-item on" id="armBtn">
        <span class="ic">⛨</span>
        <span class="meta"><div class="nm">布防模式</div><div class="ds">摄像头 3 · 传感器 8 在线</div></span>
      </button>
      <button class="grow-item on" id="lockBtn">
        <span class="ic">🔑</span>
        <span class="meta"><div class="nm">门锁</div><div class="ds">09:12 指纹开门</div></span>
      </button>
      <button class="grow-item on">
        <span class="ic">◉</span>
        <span class="meta"><div class="nm">门口摄像头</div><div class="ds">LIVE · 1080P</div></span>
      </button>

      <div class="g-title" style="margin-top:6px">场景</div>
      <div class="scenes">
        <button class="sc primary">⌂ 回家</button>
        <button class="sc">⇥ 离家</button>
        <button class="sc">☾ 睡眠</button>
        <button class="sc">▶ 观影</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="mask" id="mask"></div>
  <div class="pop glass" id="pop">
    <h4><span id="popT">客厅主灯</span><button id="popX">×</button></h4>
    <div class="slider" id="sl"><div class="track"><div class="fill" id="fill"></div></div><div class="thumb" id="thumb"></div></div>
    <div class="val" id="val">60%</div>
  </div>
</div>

<script>
var toastTimer=null;
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.classList.remove('show')},2000)}
function clk(){var d=new Date();function p(n){return String(n).padStart(2,'0')}
  document.getElementById('clk').textContent=p(d.getHours())+':'+p(d.getMinutes())}
clk();setInterval(clk,1000);

// 灯光/窗帘行：单击开关，弹窗调档（路径短：一级直开 + 弹窗细调）
var current=null;
document.querySelectorAll('.grow-item[data-name]').forEach(function(row){
  row.onclick=function(){
    var on=row.classList.toggle('on'),ds=row.querySelector('.ds');
    ds.textContent=on?(row.dataset.ds+(row.dataset.name==='氛围灯'?'3500K':row.dataset.val+'%')):'关闭';
    toast(row.dataset.name+(on?' 已打开':' 已关闭'));
    openPop(row);
  };
});
function openPop(row){
  current=row;
  document.getElementById('popT').textContent=row.dataset.name;
  setPop(Number(row.dataset.val)||50);
  document.getElementById('mask').classList.add('show');
  document.getElementById('pop').classList.add('show');
}
function closePop(){document.getElementById('mask').classList.remove('show');document.getElementById('pop').classList.remove('show');current=null}
document.getElementById('popX').onclick=closePop;
document.getElementById('mask').onclick=closePop;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePop()});
function setPop(v){v=Math.max(0,Math.min(100,v));
  document.getElementById('fill').style.width=v+'%';
  document.getElementById('thumb').style.left=v+'%';
  document.getElementById('val').textContent=v+'%';
  if(current){current.dataset.val=v;
    var ds=current.querySelector('.ds');
    if(current.classList.contains('on')){
      ds.textContent=current.dataset.name==='氛围灯'
        ?('色温'+(v*100+2000)+'K')
        :(current.dataset.ds+v+'%');}
  }
}
var sl=document.getElementById('sl');
sl.addEventListener('pointerdown',function(e){
  sl.setPointerCapture(e.pointerId);
  function mv(ev){var r=sl.getBoundingClientRect();setPop(Math.round((ev.clientX-r.left)/r.width*100))}
  mv(e);
  function up(){sl.removeEventListener('pointermove',mv);sl.removeEventListener('pointerup',up)}
  sl.addEventListener('pointermove',mv);sl.addEventListener('pointerup',up);
});

// 空调环
var AC_MIN=16,AC_MAX=30,ac=26;
var dial=document.getElementById('dial'),acT=document.getElementById('acT'),
    acM=document.getElementById('acM'),acP=document.getElementById('acP');
function renderAc(){acT.textContent=ac;
  dial.style.setProperty('--pct',Math.round((ac-AC_MIN)/(AC_MAX-AC_MIN)*100));
  acM.disabled=ac<=AC_MIN;acP.disabled=ac>=AC_MAX;}
acP.onclick=function(){if(ac<AC_MAX){ac++;renderAc()}};
acM.onclick=function(){if(ac>AC_MIN){ac--;renderAc()}};
renderAc();
var roomNames=['客厅','主卧','书房'],ri=0;
document.getElementById('roomBtn').onclick=function(){
  ri=(ri+1)%roomNames.length;this.textContent=roomNames[ri]+' ▾';toast('空调已切换到'+roomNames[ri]);
};

// 安防 / 顶栏状态联动
var armChip=document.getElementById('armChip');
document.getElementById('armBtn').onclick=function(){
  var on=this.classList.toggle('on');
  armChip.classList.toggle('ok',on);armChip.classList.toggle('warn',!on);
  armChip.querySelector('b').textContent=on?'在家布防':'已撤防';
  toast(on?'安防已布防':'安防已撤防');
};
document.getElementById('lockBtn').onclick=function(){
  var on=this.classList.toggle('on');
  var lockChip=document.getElementById('lockChip');
  lockChip.classList.toggle('ok',on);lockChip.classList.toggle('warn',!on);
  lockChip.querySelector('b').textContent=on?'已上锁':'已开锁';
  toast(on?'门锁已上锁':'门锁已开锁');
};
document.querySelectorAll('.more').forEach(function(b){
  b.onclick=function(e){e.stopPropagation();
    document.querySelectorAll('.grow-item[data-name]').forEach(function(r){
      r.classList.remove('on');r.querySelector('.ds').textContent='关闭';});
    toast('灯光已全部关闭');};
});
document.querySelectorAll('.sc').forEach(function(b){b.onclick=function(){toast('执行场景：'+b.textContent.trim())}});
document.querySelector('.mode-chip').onclick=function(){toast('切换运行模式')};

// 迷你趋势图
function spark(id,data,color){var svg=document.getElementById(id),w=56,h=24;
  var min=Math.min.apply(null,data),max=Math.max.apply(null,data),rng=max-min||1;
  var pts=data.map(function(v,i){return (i/(data.length-1)*w).toFixed(1)+','+((1-(v-min)/rng)*(h-6)+3).toFixed(1)}).join(' ');
  svg.innerHTML='<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'}
spark('sp1',[23.2,23.6,23.4,23.9,24.1,24.0],'#7DD3FC');
spark('sp2',[52,50,49,50,48,48],'#4ADE80');
spark('sp3',[520,500,490,480,475,480],'#FBBF24');
</script>
</body>
</html>
