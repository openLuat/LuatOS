<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松风阁 · 茶室会所控制面板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="viewport" id="viewport">
  <div class="screen" id="screen">

    <!-- 背景：茶室实景（移植到 Lua 时按 1024×600 直接烤图，不参与实时布局） -->
    <div class="bg">
      <img src="img/bg_night.png" alt="">
      <div class="bg__veil"></div>
    </div>
    <div class="grain"></div>

    <!-- 左轴：印章 + 竖向导航 -->
    <nav class="rail">
      <div class="seal serif" aria-hidden="true">松</div>
      <div class="rail__nav">
        <button class="rail__btn is-on" data-act="to-wall" aria-label="场景墙">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></svg>
          <span>场景</span>
        </button>
        <button class="rail__btn" data-act="service" aria-label="呼叫服务">
          <svg viewBox="0 0 24 24"><path d="M6 16h12"/><path d="M5 16a7 7 0 0 1 14 0"/><path d="M12 4.5V6.5"/><circle cx="12" cy="19" r="1.4"/></svg>
          <span>服务</span>
        </button>
      </div>
      <div class="rail__spacer"></div>
      <div class="rail__nav">
        <button class="rail__btn" data-act="mute" aria-label="静音">
          <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3l4.2 3.3V6.2L7 9.5H4z"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.8a7.6 7.6 0 0 1 0 10.4"/></svg>
          <span>静音</span>
        </button>
        <button class="rail__btn" data-act="settings" aria-label="设置">
          <svg viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
          <span>设置</span>
        </button>
      </div>
    </nav>

    <!-- 顶栏：包间 / 状态 / 时间 -->
    <header class="head">
      <div class="head__room">
        <span class="head__name serif">松风阁</span>
        <span class="head__meta">A3 包间 · 预约 20:00 · 4 位</span>
      </div>
      <span class="head__badge"><i></i>待客中</span>
      <div class="head__clock">
        <div class="head__time serif tnum" id="clock">21:40</div>
        <div class="head__date" id="dateLine">11月19日 · 室外 16° 晴</div>
      </div>
    </header>

    <!-- 舞台：两页同驻，只切显隐 -->
    <div class="stage">

      <!-- 页一：场景墙 -->
      <section class="view is-active" id="viewWall" aria-label="场景墙">
        <div class="wall">
          <div class="wall__main" id="cardMain"></div>
          <div class="wall__side" id="cardSide"></div>
        </div>
      </section>

      <!-- 页二：场景详情 -->
      <section class="view" id="viewDetail" aria-label="场景详情">
        <div class="detail">
          <div class="detail__hero" id="hero">
            <img id="heroImg" src="img/dev_light.png" alt="">
            <div class="card__shade"></div>
            <div class="card__tag"><i></i>当前场景</div>
            <div class="detail__heroFoot">
              <div class="detail__heroName serif" id="heroName">茶台灯光</div>
              <div class="detail__heroEn" id="heroEn">TEA TABLE LIGHT</div>
            </div>
          </div>

          <div class="detail__panel">
            <div class="panel__top">
              <span class="panel__state" id="dState">已开启 · <b>6</b> 档</span>
              <button class="switch is-on" id="dSwitch" data-act="power" aria-label="开关"></button>
            </div>

            <p class="panel__desc" id="dDesc">主位吊灯与茶台灯带联动，亮度越低，汤色越显。</p>
            <div class="panel__hr"></div>

            <div class="panel__row">
              <span class="panel__label">强度</span>
              <span class="panel__val serif tnum"><b id="dLevel">6</b><em>/ 10</em></span>
            </div>
            <div class="segs panel__segs" id="dSegs"></div>
            <div class="panel__ctrl">
              <button class="round" data-act="dec" aria-label="降低强度">
                <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
              </button>
              <span class="panel__hint" id="dHint">左右调节档位</span>
              <button class="round" data-act="inc" aria-label="提高强度">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>

            <div class="panel__quote serif">茶烟轻扬，一室生香</div>

            <div class="panel__chips">
              <span class="chip__title">快捷档位</span>
              <div class="chip-row" id="dChips">
                <button class="chip" data-chip="0">柔和</button>
                <button class="chip" data-chip="1">适中</button>
                <button class="chip" data-chip="2">浓郁</button>
              </div>
            </div>
          </div>
        </div>
      </section>

    </div>

    <!-- 底部：一键场景 -->
    <footer class="tray">
      <div class="tray__head">
        <span class="tray__title">一键场景</span>
        <span class="tray__note">每晚 23:00 自动清场</span>
      </div>
      <div class="tray__row" id="sceneRow"></div>
    </footer>

    <!-- 设置弹层 -->
    <div class="sheet" id="sheet">
      <div class="sheet__panel" role="dialog" aria-label="设置">
        <h2 class="sheet__title serif">设置</h2>
        <div class="sheet__sub">DISPLAY &amp; AMBIENCE</div>

        <div class="sheet__row">
          <span class="sheet__label">界面主题</span>
          <div class="chip-row" style="width:186px">
            <button class="chip is-on" data-theme-set="night">暖夜</button>
            <button class="chip" data-theme-set="paper">宣纸</button>
          </div>
        </div>
        <div class="sheet__row">
          <span class="sheet__label">屏幕亮度</span>
          <div class="chip-row" style="width:186px">
            <button class="chip" data-bright="0">暗</button>
            <button class="chip is-on" data-bright="1">标准</button>
            <button class="chip" data-bright="2">亮</button>
          </div>
        </div>
        <div class="sheet__row">
          <span class="sheet__label">门铃与提示音</span>
          <button class="switch is-on" id="sSwitch" data-act="bell" aria-label="提示音"></button>
        </div>

        <div class="sheet__foot">
          <button class="sheet__ok" data-act="close-sheet">完成</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
